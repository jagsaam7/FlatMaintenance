<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏢 Maintenance Billing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#1a1330; --panel:#241a3d; --panel2:#2c2049; --panel3:#382a5c;
  --border:#3a2b5c; --border2:#4d3a78;
  --text:#ede6fb; --muted:#a892d1; --muted2:#7d64a8;
  --accent:#9b5de5; --accent2:#c084f5; --accent3:#7b3fc4;
  --grad-accent:linear-gradient(135deg,#9b5de5 0%,#c084f5 100%);
  --grad-bg:radial-gradient(1200px 600px at 8% -8%,rgba(155,93,229,.12),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(46,194,126,.06),transparent 55%);
  --paid:#2ec27e; --paid-bg:rgba(46,194,126,.14);
  --partial:#f0b429; --partial-bg:rgba(240,180,41,.14);
  --unpaid:#f2555a; --unpaid-bg:rgba(242,85,90,.14);
  --radius:10px; --radius-sm:7px; --radius-lg:16px;
  --shadow:0 4px 20px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.35);
  --shadow-glow:0 4px 20px rgba(155,93,229,.3);
  --glass:rgba(36,26,61,.75);
  --ease:cubic-bezier(.22,1,.36,1);
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme="light"]{
  --bg:#fffdf2; --panel:#fffbe8; --panel2:#fef7d8; --panel3:#fbf0bd;
  --border:#f0e2a3; --border2:#e0cd7a;
  --text:#2e1f4d; --muted:#6b5a94; --muted2:#8f7fb5;
  --accent:#9b5de5; --accent2:#7b3fc4; --accent3:#5f2ea3;
  --grad-bg:radial-gradient(1200px 600px at 8% -8%,rgba(155,93,229,.08),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(31,157,99,.05),transparent 55%);
  --paid:#1f9d63; --paid-bg:rgba(31,157,99,.12);
  --partial:#b3830a; --partial-bg:rgba(179,131,10,.12);
  --unpaid:#d8383e; --unpaid-bg:rgba(216,56,62,.12);
  --shadow:0 4px 20px rgba(120,100,20,.12);
  --shadow-sm:0 1px 3px rgba(120,100,20,.10);
  --glass:rgba(255,251,232,.78);
}
[data-theme="light"] tbody tr.block-sep td{background:#f3e8fc;}
[data-theme="light"] #flatTooltip{background:rgba(255,251,232,.97);color:var(--text);}
[data-theme="light"] .overlay{background:rgba(46,31,77,.35);}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:#e0cd7a;}
*{box-sizing:border-box;margin:0;padding:0;}
body,#sidebar,.card,.block-card,.gallery-card,table,.modal,#dbBar,#authBox,.tile,.month-item{transition:background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease);}
.theme-toggle{display:flex;align-items:center;gap:8px;padding:0 12px 10px;}
.theme-toggle-label{font-size:11px;color:var(--muted);font-weight:600;flex:1;}
.theme-switch{position:relative;width:44px;height:24px;border-radius:20px;border:1px solid var(--border2);background:var(--panel3);cursor:pointer;flex-shrink:0;transition:background .2s var(--ease),border-color .2s var(--ease);}
.theme-switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--grad-accent);box-shadow:0 1px 3px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:10px;transition:transform .25s var(--ease);}
[data-theme="light"] .theme-switch .knob{transform:translateX(20px);}
[data-theme="light"] .theme-switch{background:#ecdcf7;}
*:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--bg);background-image:var(--grad-bg);background-attachment:fixed;color:var(--text);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--border2),var(--border2));border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--accent3);background-clip:padding-box;}

#app{display:flex;height:100vh;}

/* SIDEBAR */
#sidebar{width:260px;min-width:260px;background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-logo{padding:16px 16px 12px;border-bottom:1px solid var(--border);}
.sb-logo h1{font-family:var(--font-display);font-size:12.5px;font-weight:700;letter-spacing:.2px;line-height:1.32;background:var(--grad-accent);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.sb-logo p{font-size:10.5px;color:var(--muted);margin-top:3px;}


#dbBar{margin:10px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:11px;}
.sb-label{color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px;}
.sb-label span{font-weight:600;color:var(--text);}
#dbStatus{font-size:10px;color:var(--muted);margin-top:5px;}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;background:var(--muted2);}
.status-dot.ok{background:var(--paid);box-shadow:0 0 6px var(--paid);}
.status-dot.warn{background:var(--partial);box-shadow:0 0 6px var(--partial);}
.status-dot.err{background:var(--unpaid);box-shadow:0 0 6px var(--unpaid);}

#configBtn{margin-top:7px;width:100%;padding:6px 0;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--accent2);font-size:11px;font-weight:600;cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease);}
#configBtn:hover{background:var(--panel3);border-color:var(--accent);}

#authBox{margin:0 12px 2px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:6px;}
.astat{font-size:11.5px;font-weight:700;}
.astat.on{color:var(--paid);}
.astat.off{color:var(--muted);}
#authBtn{padding:4px 10px;font-size:11px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;transition:border-color .15s var(--ease);}
#authBtn:hover{border-color:var(--accent);}

#newMonthBtn{width:calc(100% - 24px);margin:8px 12px;padding:11px;border:none;border-radius:var(--radius);background:var(--grad-accent);color:#fff;font-weight:700;font-size:13px;font-family:var(--font-body);cursor:pointer;box-shadow:var(--shadow-glow);transition:transform .15s var(--ease),box-shadow .15s var(--ease),filter .15s;}
#newMonthBtn:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 6px 26px rgba(155,93,229,.38);}
#newMonthBtn:active{transform:translateY(0);}
#newMonthBtn:disabled{background:var(--panel3);color:var(--muted);cursor:not-allowed;box-shadow:none;}

#monthList{flex:1;overflow-y:auto;padding:4px 8px 12px;}
.month-item{padding:10px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:4px;border:1px solid transparent;transition:background .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease);}
.month-item:hover{background:var(--panel2);transform:translateX(2px);}
.month-item.active{background:linear-gradient(135deg,rgba(155,93,229,.14),rgba(155,93,229,.05));border-color:var(--accent);}
.month-item .mlabel{font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
.mtag{font-size:9px;padding:2px 7px;border-radius:20px;background:var(--panel3);color:var(--muted);font-weight:700;letter-spacing:.3px;}
.month-item.active .mtag.current{background:var(--accent3);color:var(--accent2);}
.month-item .msub{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;}
.sb-footer{padding:10px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--muted2);line-height:1.5;}

/* MAIN */
#main{flex:1;overflow-y:auto;padding:22px 28px 70px;}
#topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
#topbar h2{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.2px;}
#topbar .sub{color:var(--muted);font-size:12px;margin-top:5px;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

.btn{padding:8px 13px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:12.5px;cursor:pointer;font-weight:500;font-family:var(--font-body);display:inline-flex;align-items:center;gap:6px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .1s var(--ease);}
.btn:hover{border-color:var(--accent);background:var(--panel3);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.primary{background:var(--grad-accent);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 2px 12px rgba(155,93,229,.3);}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 4px 18px rgba(155,93,229,.4);}
.btn.danger{color:#f2555a;}
.btn.danger:hover{border-color:var(--unpaid);background:rgba(240,66,74,.08);}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;transform:none;}

.viewToggle{display:flex;border:1px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden;background:var(--panel2);}
.viewToggle button{border:none;background:transparent;color:var(--muted);padding:8px 14px;font-size:12.5px;cursor:pointer;font-weight:600;font-family:var(--font-body);transition:background .15s var(--ease),color .15s var(--ease);}
.viewToggle button.active{background:var(--grad-accent);color:#fff;}

#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--border2);}
.card .clabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
.card .cval{font-family:var(--font-mono);font-size:20px;font-weight:700;margin-top:7px;font-variant-numeric:tabular-nums;}
.card.paidcol .cval{color:var(--paid);}
.card.pendcol .cval{color:var(--unpaid);}

#controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
#controls input[type=text],#controls select{background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:8px 10px;border-radius:var(--radius-sm);font-size:12.5px;font-family:var(--font-body);transition:border-color .15s var(--ease);}
#controls input[type=text]{width:200px;}
#controls select{cursor:pointer;}
#controls input[type=text]:focus,#controls select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,93,229,.15);}

.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);min-width:700px;}
thead th{text-align:left;background:var(--glass);backdrop-filter:blur(10px);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;padding:11px 12px;position:sticky;top:0;z-index:1;white-space:nowrap;border-bottom:1px solid var(--border);}
tbody td{padding:9px 12px;border-top:1px solid var(--border);font-family:var(--font-mono);}
tbody td:not(.num){font-family:var(--font-body);}
tbody tr.block-sep td{background:#140d24;font-weight:800;color:var(--accent2);font-size:11.5px;padding-top:14px;letter-spacing:.4px;font-family:var(--font-display);}
tbody tr:hover td{background:#2c2049;}
.status-chip{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;white-space:nowrap;}
.status-chip.paid{background:var(--paid-bg);color:var(--paid);box-shadow:inset 0 0 0 1px rgba(46,194,126,.25);}
.status-chip.partial{background:var(--partial-bg);color:var(--partial);box-shadow:inset 0 0 0 1px rgba(232,176,32,.25);}
.status-chip.unpaid{background:var(--unpaid-bg);color:var(--unpaid);box-shadow:inset 0 0 0 1px rgba(240,66,74,.25);}
.paybtn{padding:5px 11px;font-size:11.5px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--panel2);color:var(--text);cursor:pointer;white-space:nowrap;transition:border-color .15s var(--ease),transform .1s var(--ease);}
.paybtn:hover{border-color:var(--accent);transform:translateY(-1px);}
.paybtn:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}

#blockGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
.block-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);}
.block-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--border2);}
.block-card .bc-head{background:var(--panel2);padding:11px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.bc-head .bname{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.4px;color:var(--accent2);}
.bc-head .bstats{font-size:10.5px;color:var(--muted);font-weight:600;}
.bc-body{padding:12px 14px;display:flex;flex-direction:column;gap:9px;}
.bc-row{display:flex;align-items:center;gap:8px;}
.bc-floor{width:34px;font-size:9.5px;color:var(--muted2);font-weight:800;flex-shrink:0;letter-spacing:.3px;}
.bc-tiles{display:flex;gap:7px;flex-wrap:wrap;flex:1;}
.tile{min-width:50px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;font-family:var(--font-mono);color:#fff;cursor:default;transition:transform .15s var(--ease),box-shadow .15s var(--ease);}
.tile.status-paid{background:linear-gradient(145deg,#2ec27e,#1f9d63);}
.tile.status-partial{background:linear-gradient(145deg,#f0b429,#b3830a);}
.tile.status-unpaid{background:linear-gradient(145deg,#f2555a,#b23238);}
.tile.admin-edit{cursor:pointer;}
.tile.admin-edit:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 6px 16px rgba(0,0,0,.45);}

#flatTooltip{position:fixed;z-index:900;background:rgba(26,19,48,.94);backdrop-filter:blur(12px);border:1px solid var(--accent3);border-radius:var(--radius);padding:11px 13px;font-size:12px;line-height:1.65;box-shadow:var(--shadow);pointer-events:none;display:none;min-width:180px;color:#ede6fb;}
#flatTooltip.wide{min-width:360px;max-width:460px;}
#flatTooltip .tt-title{font-weight:800;font-size:13px;margin-bottom:5px;color:var(--accent2);}
#flatTooltip .tt-row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);}
#flatTooltip .tt-row b{color:var(--text);font-weight:600;}
#flatTooltip .tt-status{margin-top:5px;font-weight:800;font-size:12px;}
/* Receipt section inside tooltip — allow clicks */
.tt-bills-section{pointer-events:auto;margin-top:8px;border-top:1px solid var(--border2);padding-top:8px;}
.tt-bills-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:7px;}
.tt-bill-strip{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;}
.tt-bill-item{flex-shrink:0;position:relative;width:70px;}
.tt-bill-item img{width:70px;height:70px;object-fit:cover;border-radius:7px;border:1.5px solid var(--border2);cursor:pointer;display:block;transition:border-color .12s,transform .12s;}
.tt-bill-item img:hover{border-color:var(--accent2);transform:scale(1.04);}
.tt-bill-item .tt-bill-label{font-size:8.5px;color:var(--muted);text-align:center;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tt-bill-item .tt-bill-method{position:absolute;top:3px;left:3px;font-size:9px;background:rgba(0,0,0,.65);border-radius:3px;padding:1px 3px;line-height:1;}
.tt-bill-pdf{flex-shrink:0;width:70px;height:70px;border-radius:7px;border:1.5px solid var(--border2);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:26px;}
.tt-updated{font-size:10px;color:var(--muted2);margin-top:6px;padding-top:5px;border-top:1px solid var(--border);line-height:1.4;}

.legend{display:flex;gap:16px;align-items:center;margin:4px 0 16px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.legend i.paid{background:var(--paid);}
.legend i.partial{background:var(--partial);}
.legend i.unpaid{background:var(--unpaid);}

.overlay{position:fixed;inset:0;background:rgba(4,8,14,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:1000;animation:overlayIn .18s var(--ease);}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:22px 24px;width:420px;max-width:92vw;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto;animation:modalIn .22s var(--ease);}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.modal h3{margin:0 0 16px;font-family:var(--font-display);font-size:16.5px;font-weight:700;}
.modal label{display:block;font-size:11.5px;color:var(--muted);margin:12px 0 5px;font-weight:600;letter-spacing:.2px;}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:13px;font-family:inherit;transition:border-color .15s var(--ease),box-shadow .15s var(--ease);}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,93,229,.15);}
.modal .modalbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.modal .hint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5;}
.modal .err{font-size:12px;color:var(--unpaid);margin-top:9px;min-height:14px;}
.checkrow{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--muted);}
.lockbadge{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;padding:7px 11px;background:var(--panel2);border-radius:8px;border:1px solid var(--border);}
.closedbadge{font-size:11px;font-weight:700;color:#2ec27e;display:flex;align-items:center;gap:5px;padding:7px 11px;background:rgba(46,194,126,.12);border-radius:8px;border:1px solid rgba(46,194,126,.3);}
.btn.closebill{background:linear-gradient(135deg,#5f2ea3,#7b3fc4);border-color:#7b3fc4;color:#fff;font-weight:700;}
.btn.closebill:hover{background:linear-gradient(135deg,#7b3fc4,#9b5de5);}
.btn.reopenbill{background:rgba(240,180,41,.12);border-color:#f0b429;color:#f0b429;font-weight:700;}
.btn.reopenbill:hover{background:rgba(240,180,41,.22);}
.closure-panel{background:var(--panel2);border:1px solid rgba(46,194,126,.25);border-radius:10px;padding:14px 16px;margin-bottom:20px;}
.closure-panel .cp-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:10px;}
.closure-panel .cp-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;}
.closure-panel .cp-row:last-child{border-bottom:none;font-weight:800;color:var(--text);padding-top:8px;}
.closure-panel .cp-row span:last-child{font-variant-numeric:tabular-nums;}
.bwss-item{display:flex;align-items:center;gap:8px;background:var(--panel3);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px;}
.btn[style*="border-style:dashed"]{border-style:dashed!important;}
.bwss-item .bi-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.empty{text-align:center;padding:70px 20px;color:var(--muted);}
.empty h2{font-family:var(--font-display);font-size:22px;font-weight:700;margin-bottom:12px;color:var(--text);}
.empty p{font-size:13px;line-height:1.7;max-width:440px;margin:0 auto;color:var(--muted);}

/* setup box */
.setup-box{background:var(--panel2);border:1px solid var(--border2);border-radius:var(--radius);padding:18px 20px;margin-top:20px;max-width:480px;text-align:left;}
.setup-box h3{font-family:var(--font-display);font-size:14.5px;font-weight:700;margin-bottom:10px;color:var(--accent2);}
.setup-box .field{margin-bottom:10px;}
.setup-box label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600;}
.setup-box input{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border2);background:var(--panel);color:var(--text);font-size:12px;font-family:monospace;}
.setup-box input:focus{outline:none;border-color:var(--accent);}
.setup-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6;}

#toastContainer{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border2);padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;box-shadow:var(--shadow);animation:fadeUp .22s var(--ease);max-width:340px;}
.toast.ok{border-left:3px solid var(--paid);}
.toast.warn{border-left:3px solid var(--partial);}
.toast.err{border-left:3px solid var(--unpaid);}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* spinner */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}

@media(max-width:800px){#sidebar{width:220px;min-width:220px;}#main{padding:14px 14px 60px;}}
@media(max-width:600px){#app{flex-direction:column;}#sidebar{width:100%;min-width:unset;height:auto;max-height:50vh;}#main{overflow-y:auto;}}

/* ══════════ GALLERY VIEW ══════════ */
#galleryView{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}

#appTabBar button{padding:9px 18px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;border:1px solid var(--border);border-bottom:none;background:var(--panel2);color:var(--muted);font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s var(--ease);}

#reportsContainer{padding:18px 20px 24px;}
.report-controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.report-controls input,.report-controls select{padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:13px;font-family:var(--font-body);}
#reportCardsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.report-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:border-color .18s var(--ease),box-shadow .18s var(--ease);}
.report-card:hover{border-color:var(--accent2);box-shadow:var(--shadow-glow);}
.report-card .rc-head{display:flex;align-items:center;justify-content:space-between;}
.report-card .rc-flat{font-family:var(--font-display);font-weight:700;font-size:15px;}
.report-card .rc-floor{font-size:10.5px;color:var(--muted);}
.report-card .rc-stat{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
.report-card .rc-stat b{color:var(--text);}
.report-card .rc-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.report-card .rc-badge.paid{background:var(--paid-bg);color:var(--paid);}
.report-card .rc-badge.partial{background:var(--partial-bg);color:var(--partial);}
.report-card .rc-badge.unpaid{background:var(--unpaid-bg);color:var(--unpaid);}
.report-card .rc-dlbtn{margin-top:4px;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--accent2);background:transparent;color:var(--accent2);font-family:var(--font-body);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s var(--ease);}
.report-card .rc-dlbtn:hover{background:var(--accent2);color:#fff;}
.gallery-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease);}
.gallery-card:hover{border-color:var(--border2);box-shadow:var(--shadow-sm);transform:translateY(-2px);}
.gallery-card .gc-thumb{width:100%;height:130px;object-fit:cover;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:38px;position:relative;overflow:hidden;}

.gallery-card .gc-thumb .gc-count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:12px;backdrop-filter:blur(4px);}
.gallery-card .gc-thumb .gc-pdf-icon{font-size:42px;}
.gallery-card .gc-body{padding:11px 13px;flex:1;display:flex;flex-direction:column;gap:6px;}
.gallery-card .gc-flat{font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.gallery-card .gc-flat .gc-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.gallery-card .gc-flat .gc-status.paid{background:var(--paid-bg);color:var(--paid);}
.gallery-card .gc-flat .gc-status.partial{background:var(--partial-bg);color:var(--partial);}
.gallery-card .gc-meta{font-size:11px;color:var(--muted);line-height:1.6;}
.gallery-card .gc-meta b{color:var(--text);}
.gallery-card .gc-updated{font-size:10px;color:var(--muted2);margin-top:2px;border-top:1px solid var(--border);padding-top:6px;}
.gallery-card .gc-actions{display:flex;gap:6px;padding:8px 13px 12px;}
.gallery-card .gc-actions button{flex:1;padding:6px 0;border-radius:6px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:11.5px;cursor:pointer;transition:border-color .12s;}
.gallery-card .gc-actions button:hover{border-color:var(--accent);background:var(--panel3);}
.gallery-empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1;}
.gallery-empty h3{font-size:18px;color:var(--text);margin-bottom:8px;}
.gallery-filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;}
.gallery-filter-bar label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.gallery-filter-bar select,.gallery-filter-bar input{background:var(--panel);border:1px solid var(--border2);color:var(--text);padding:6px 9px;border-radius:7px;font-size:12px;cursor:pointer;}
.gallery-filter-bar select:focus,.gallery-filter-bar input:focus{outline:none;border-color:var(--accent);}

/* ══════════ ENHANCED TOOLTIP ══════════ */
#flatTooltip.wide{min-width:340px;max-width:420px;}
.tt-bills-section{margin-top:8px;border-top:1px solid var(--border2);padding-top:8px;}

.sealed-stamp-outer{display:flex;justify-content:flex-end;margin:20px 0 8px;padding-right:4px;}

.stamp-content .sc-emoji{font-size:26px;line-height:1;}
.stamp-content .sc-title{font-size:8.5px;font-weight:900;color:#2ec27e;letter-spacing:1.8px;text-transform:uppercase;text-align:center;line-height:1.35;margin-top:2px;}
.stamp-content .sc-by{font-size:7.5px;font-weight:700;color:rgba(46,194,126,.8);letter-spacing:.6px;text-align:center;line-height:1.4;margin-top:2px;}

.banner-ok{background:rgba(46,194,126,.1);border:1px solid rgba(46,194,126,.35);border-radius:9px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#2ec27e;line-height:1.6;}
.banner-grace{background:rgba(240,180,41,.1);border:1px solid rgba(240,180,41,.35);border-radius:9px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#f0b429;line-height:1.6;}
.banner-early{background:rgba(74,157,232,.1);border:1px solid rgba(74,157,232,.35);border-radius:9px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--accent2);line-height:1.6;}
.banner-auto{background:rgba(242,85,90,.1);border:1px solid rgba(242,85,90,.35);border-radius:9px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:#f2555a;line-height:1.6;}

.attach-menu.open{display:flex;}
.attach-menu button{display:flex;align-items:center;gap:9px;background:none;border:none;color:var(--text);font-size:12.5px;padding:8px 12px;border-radius:7px;cursor:pointer;width:100%;text-align:left;}
.attach-menu button:hover{background:var(--panel2);}
.bwss-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.bwss-thumb{position:relative;width:60px;height:60px;flex-shrink:0;}
.bwss-thumb img,.bwss-thumb .pdf-icon{width:60px;height:60px;object-fit:cover;border-radius:9px;border:1.5px solid var(--border2);}
.bwss-thumb .pdf-icon{background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--accent2);}
.bwss-thumb .pin-decal{position:absolute;top:-8px;left:-2px;font-size:16px;transform:rotate(-18deg);pointer-events:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));}
.bwss-thumb .th-del{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;background:var(--unpaid);border:none;color:#fff;font-size:10px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;z-index:5;}
.bwss-thumb .th-dl{position:absolute;bottom:-6px;right:-6px;width:19px;height:19px;border-radius:50%;background:var(--accent3);border:none;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;}
.bwss-thumb .th-name{position:absolute;bottom:-18px;left:0;right:0;font-size:8px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bwss-total-bar{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--border2);border-radius:9px;padding:9px 14px;margin-top:2px;font-size:13px;}

.bwss-total-bar .bt-val{font-weight:800;color:var(--accent2);font-size:15px;}

<script>
'use strict';

/* ============================================================
   ASSOCIATION LOGO (embedded, used in sidebar header + PDF export)

/* ============================================================
   TURSO SQL HELPER
   ============================================================ */
async function sql(statements){
  if(!isTursoConfigured()) throw new Error('Turso not configured');
  const requests = statements.map(s=>({
    type:'execute',
    stmt:{
      sql: s.q,
      args: (s.params||[]).map(v=>{
        if(v===null||v===undefined) return {type:'null'};
        if(typeof v==='number') return {type:'float',value:v};
        return {type:'text',value:String(v)};
      })
    }
  }));
  requests.push({type:'close'});
  const res = await fetch(`${TURSO_URL}/v2/pipeline`,{
    method:'POST',
    headers:{
      'Authorization':`Bearer ${TURSO_TOKEN}`,
      'Content-Type':'application/json',
    },
    body: JSON.stringify({requests})
  });
  if(!res.ok){
    const txt = await res.text();
    throw new Error(`Turso HTTP ${res.status}: ${txt.slice(0,200)}`);
  }
  const data = await res.json();
  // Check for per-statement errors
  for(const r of data.results||[]){
    if(r.type==='error') throw new Error(r.error?.message||'Turso error');
  }
  return data.results||[];
}

function rowsToObjects(result){
  if(!result?.response?.result) return [];
  const {cols,rows}=result.response.result;
  return rows.map(r=>Object.fromEntries(cols.map((c,i)=>[c.name, r[i]?.value??null])));
}

  const migrations=[

    `ALTER TABLE flat_payments ADD COLUMN payment_comments TEXT`,
    `ALTER TABLE flat_payments ADD COLUMN payment_screenshot TEXT`,

    `ALTER TABLE billing_months ADD COLUMN closed_collected REAL DEFAULT 0`,
    `ALTER TABLE billing_months ADD COLUMN closed_balance REAL DEFAULT 0`,
  ];
  for(const q of migrations){ try{ await sql([{q}]); }catch(e){ /* column already exists — ignore */ } }
  // Ensure snapshot table exists on every load (idempotent)
  try{ await ensureSnapshotTable(); }catch(e){ console.warn('snapshot table init:',e); }
}

const round2=n=>Math.round((n+Number.EPSILON)*100)/100;
const inr=n=>'₹'+(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
// For a Balance figure specifically: negative means Paid > Due (overpaid) — show that
// as a "+₹500.00" excess instead of a confusing negative "₹-500.00".
const inrBalance=n=>{
  // Treat anything within a paisa of zero as exactly zero — this is what stops a stray
  // "-₹0.00" from floating-point rounding dust when Total Due + Carry Forward has been
  // fully collected (e.g. paid exactly covers ₹800 due + ₹300 carry-forward = ₹1,100).
  if(Math.abs(n)<0.005) return inr(0);
  return n<0?'+'+inr(Math.abs(n)):inr(n);
};
/* ============================================================
   DATE FORMATTING — DD-MM-YYYY everywhere in the UI/PDF/Excel.
   Accepts a Date object, a date-only string ("YYYY-MM-DD" from
   <input type="date">), or a full ISO timestamp string.
   ============================================================ */
function fmtDDMMYYYY(d){
  if(!d) return '';
  if(typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d)){
    // Parse date-only strings manually — new Date("YYYY-MM-DD") is UTC midnight and
    // can shift a day backward/forward once read back via local getDate().
    const[y,mo,day]=d.split('-');
    return `${day}-${mo}-${y}`;
  }
  const dt=d instanceof Date?d:new Date(d);
  if(isNaN(dt.getTime())) return String(d);
  const dd=String(dt.getDate()).padStart(2,'0');
  const mm=String(dt.getMonth()+1).padStart(2,'0');
  return `${dd}-${mm}-${dt.getFullYear()}`;
}
function fmtDDMMYYYYTime(d){
  if(!d) return '';
  const dt=d instanceof Date?d:new Date(d);
  if(isNaN(dt.getTime())) return String(d);
  const timeStr=dt.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true});
  return `${fmtDDMMYYYY(dt)}, ${timeStr}`;
}
/* PDF-only currency helpers — jsPDF's built-in Helvetica font has no glyph for ₹ and
   silently prints "1" in its place, so PDFs use a plain "Rs." prefix instead. */
const inrPdf=n=>'Rs. '+(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const balPdf=n=>n<-0.004?'+ '+inrPdf(Math.abs(n)):inrPdf(n);
const monthLabel=key=>{const[y,m]=key.split('-');return new Date(+y,+m-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'});};

/* ── Status rules (controls tile colour) ──────────────────────────
   GREEN   balance ≤ 0  →  fully paid this month
   YELLOW  paid > 0 this month  →  partial payment recorded
           OR carryForward > 0 AND prevStatus was 'partial'
              (they paid something last month but not in full)
   RED     paid = 0 AND (no carry-forward
              OR prevStatus was 'unpaid'/'paid' with no payment this month)
           → chronically unpaid flats stay red even when carrying forward
             a balance, because they have never paid anything
   prevStatus: status string from the immediately preceding month's flat.
               Pass null/undefined when there is no previous month.           */
function computeFlatStatus(balance, paid, carryForward, prevStatus){
  if(balance <= 0.004) return 'paid';
  if(paid > 0)         return 'partial';
  // Carry-forward from a PARTIAL payer → keep yellow (they have paid history)
  if((carryForward||0) > 0 && prevStatus === 'partial') return 'partial';
  // Everything else: never paid / fully unpaid last month → red
  return 'unpaid';
}

        label:m.label, totalAmount:+m.total_amount, baseShare:+m.base_share,
        notes:m.notes||'', hasBillFile:!!+m.has_bill_file, flats:{},
        isClosed:!!+m.is_closed, closedAt:m.closed_at||null,
        closedBwssTotal:+(m.closed_bwss_total||0),
        closedCollected:+(m.closed_collected||0),
        closedBalance:+(m.closed_balance||0)
      };
    }
    for(const p of payments){
      if(state.months[p.month_key]){
        state.months[p.month_key].flats[p.flat_id]={
          carryForward:+p.carry_forward, due:+p.due, paid:+p.paid,
          balance:+p.balance, status:p.status, paidDate:p.paid_date||null,
          paymentMethod:p.payment_method||null, paymentComments:p.payment_comments||null,
          paymentScreenshot:p.payment_screenshot||null, updatedAt:p.updated_at||null,
          prevStatus:p.prev_status||null, penalty:+(p.penalty||0)
        };
      }
    }
    if(state.monthOrder.length) selectedMonth=state.monthOrder[state.monthOrder.length-1];
    updateDbUI('ok','Connected · '+TURSO_URL.replace('https://','').split('.')[0]);
    document.getElementById('flatCountLabel').textContent=`${TOTAL_FLATS} Flats · Blocks ${BLOCKS[0].block}–${BLOCKS[BLOCKS.length-1].block}`;
    return true;
  }catch(e){
    updateDbUI('err','Error: '+e.message.slice(0,40));
    toast('⚠ Turso error: '+e.message,'err');
    return false;
  }
}

/* ════════════════════════════════════════════
   MONTH SNAPSHOTS  — restore points per month
   ════════════════════════════════════════════ */
const SNAPSHOT_MAX=20; // keep latest N snapshots per month

async function ensureSnapshotTable(){
  await sql([{q:`CREATE TABLE IF NOT EXISTS month_snapshots (
    id INTEGER PRIMARY KEY AUTOINCREMENT,
    month_key TEXT NOT NULL,
    trigger TEXT NOT NULL,
    snapshot_at TEXT NOT NULL,
    total_amount REAL DEFAULT 0,
    base_share REAL DEFAULT 0,
    collected REAL DEFAULT 0,
    pending REAL DEFAULT 0,
    paid_count INTEGER DEFAULT 0,
    flats_json TEXT NOT NULL,
    created_at TEXT DEFAULT (datetime('now'))
  )`}]);
  try{ await sql([{q:`CREATE INDEX IF NOT EXISTS idx_snaps_month ON month_snapshots(month_key,id DESC)`}]); }catch(e){}
}

async function saveSnapshot(monthKey, trigger){
  try{
    await ensureSnapshotTable();
    const m=state.months[monthKey];
    if(!m) return;
    const flatsArr=ALL_FLATS.map(f=>({...f,...m.flats[f.id]}));
    const collected=round2(flatsArr.reduce((s,f)=>s+f.paid,0));
    const pending=round2(flatsArr.reduce((s,f)=>s+f.balance,0));
    const paidCount=flatsArr.filter(f=>f.status==='paid').length;
    // Compact flat snapshot — only non-zero / meaningful fields to keep JSON small
    const flatsCompact={};
    for(const f of ALL_FLATS){
      const fd=m.flats[f.id]||{};
      flatsCompact[f.id]={
        cf:fd.carryForward||0, due:fd.due||0, paid:fd.paid||0,
        bal:fd.balance||0, st:fd.status||'unpaid',
        dt:fd.paidDate||null, mth:fd.paymentMethod||null
      };
    }
    await sql([{
      q:`INSERT INTO month_snapshots (month_key,trigger,snapshot_at,total_amount,base_share,collected,pending,paid_count,flats_json) VALUES (?,?,?,?,?,?,?,?,?)`,
      params:[monthKey,trigger,new Date().toISOString(),m.totalAmount,m.baseShare,collected,pending,paidCount,JSON.stringify(flatsCompact)]
    }]);
    // Prune oldest beyond SNAPSHOT_MAX
    await sql([{
      q:`DELETE FROM month_snapshots WHERE month_key=? AND id NOT IN (SELECT id FROM month_snapshots WHERE month_key=? ORDER BY id DESC LIMIT ${SNAPSHOT_MAX})`,
      params:[monthKey,monthKey]
    }]);
  }catch(e){ console.warn('snapshot save failed:',e); }
}

async function getSnapshots(monthKey){
  await ensureSnapshotTable();
  const res=await sql([{
    q:`SELECT id,trigger,snapshot_at,total_amount,base_share,collected,pending,paid_count FROM month_snapshots WHERE month_key=? ORDER BY id DESC LIMIT ${SNAPSHOT_MAX}`,
    params:[monthKey]
  }]);
  return rowsToObjects(res[0]);
}

async function getSnapshotFlats(snapshotId){
  await ensureSnapshotTable();
  const res=await sql([{q:`SELECT flats_json FROM month_snapshots WHERE id=?`,params:[snapshotId]}]);
  const rows=rowsToObjects(res[0]);
  if(!rows.length) return null;
  try{ return JSON.parse(rows[0].flats_json); }catch(e){ return null; }
}

async function restoreSnapshot(monthKey, snapshotId){
  const flatsCompact=await getSnapshotFlats(snapshotId);
  if(!flatsCompact) throw new Error('Snapshot data not found');
  const m=state.months[monthKey];
  if(!m) throw new Error('Month not found in state');
  // Get the summary row so we can restore totalAmount/baseShare
  const res=await sql([{q:`SELECT total_amount,base_share FROM month_snapshots WHERE id=?`,params:[snapshotId]}]);
  const row=rowsToObjects(res[0])[0];
  if(!row) throw new Error('Snapshot row missing');
  // Save a snapshot of current state BEFORE overwriting (so you can undo the restore)
  await saveSnapshot(monthKey,'pre_restore');
  // Rebuild flats from compact form, preserving any screenshot data already in DB
  for(const f of ALL_FLATS){
    const c=flatsCompact[f.id];
    if(!c) continue;
    const existing=m.flats[f.id]||{};
    m.flats[f.id]={
      carryForward:c.cf, due:c.due, paid:c.paid, balance:c.bal,
      status:c.st, paidDate:c.dt, paymentMethod:c.mth,
      // preserve screenshot/comments from current DB — not overwritten by restore
      paymentScreenshot:existing.paymentScreenshot||null,
      paymentComments:existing.paymentComments||null,
      updatedAt:existing.updatedAt||null
    };
  }
  m.totalAmount=+row.total_amount;
  m.baseShare=+row.base_share;
  await saveMonthToTurso(monthKey);
}

/* ════════════════════════════════════════════
   CLOSE / REOPEN MONTH  — with auto-close logic
   ════════════════════════════════════════════ */
function getLastDayOfMonth(key){
  const [y,m]=key.split('-').map(Number);
  return new Date(y,m,0);
}
/* Returns days difference: negative=before last day, 0=last day, positive=days past */
function daysPastLastDay(key){
  const [y,m]=key.split('-').map(Number);
  const today=new Date(); today.setHours(0,0,0,0);
  const lastDay=new Date(y,m,0); lastDay.setHours(0,0,0,0);
  return Math.round((today-lastDay)/(864e5));
}
/*
  status: 'early'   – before last day of month
          'ontime'  – exactly last day (closes automatically today)
          'overdue' – past last day and still not closed (auto-close triggers)
*/
function getMonthCloseStatus(key){
  const d=daysPastLastDay(key);
  if(d<0)  return {status:'early', daysLeft:-d};
  if(d===0) return {status:'ontime'};
  return {status:'overdue',daysOver:d};
}
async function closeMonth(key,bwssTotal,collected,balance,autoClose=false){
  await saveSnapshot(key, autoClose?'auto_close':'close'); // snapshot BEFORE sealing
  const m=state.months[key];
  m.isClosed=true;
  m.closedAt=new Date().toISOString();
  m.closedBwssTotal=round2(bwssTotal);
  m.closedCollected=round2(collected);
  m.closedBalance=round2(balance);
  if(autoClose) m.autoClosedAt=new Date().toISOString();
  await saveMonthToTurso(key);
}
async function reopenMonth(key){
  if(!isAdmin()) throw new Error('Admin only');
  await saveSnapshot(key,'reopen'); // snapshot BEFORE reopening
  const m=state.months[key];
  m.isClosed=false; m.closedAt=null; m.autoClosedAt=null;
  await saveMonthToTurso(key);
}
/* Auto-close any month that has reached (or passed) its last day and isn't closed yet.
   Carry-forward to the next month is unaffected by this — it's computed straight from
   each flat's due vs. paid regardless of whether the month is marked closed, so dues
   flow into the next month's cycle immediately either way. */
async function autoCloseOverdueMonths(){
  for(const key of state.monthOrder){
    const m=state.months[key];
    if(m.isClosed) continue;
    const st=getMonthCloseStatus(key).status;
    if(st!=='ontime' && st!=='overdue') continue;
    const flatsArr=ALL_FLATS.map(f=>({...f,...m.flats[f.id]}));
    const collected=round2(flatsArr.reduce((s,f)=>s+f.paid,0));
    await closeMonth(key,m.closedBwssTotal||0,collected,round2(collected-(m.closedBwssTotal||0)),true);
    toast(`🔒 ${m.label} was auto-closed on its last day — sealed by President`,'warn');
  }
}

/* ============================================================
   BILLING LOGIC
   ============================================================ */
function prevKeyOf(key){const i=state.monthOrder.indexOf(key);return i>0?state.monthOrder[i-1]:null;}
function computeMonthFlats(baseShare,prevMonth,existingFlats){
  const flats={};
  for(const f of ALL_FLATS){
    const prevF=prevMonth?prevMonth.flats[f.id]:null;
    // carryForward = unpaid balance remaining at end of previous month
    let carryForward=prevF?round2(Math.max(0,prevF.due-prevF.paid)):0;
    // prevStatus drives colour inheritance (partial→yellow, unpaid/paid-fresh→red)
    const prevStatus=prevF?prevF.status:null;
    // Late fine — flats left fully UNPAID (red) last month get a fixed admin-set fine
    // added on top of their carry-forward this month. Left unpaid again, next month's
    // carry-forward already includes this fine, so it naturally compounds each
    // consecutive unpaid month.
    const penalty=(prevStatus==='unpaid' && lateFineAmount>0) ? lateFineAmount : 0;
    if(penalty>0) carryForward=round2(carryForward+penalty);
    const due=round2(baseShare+carryForward);
    const ex=existingFlats?existingFlats[f.id]:null;
    const paid=ex?ex.paid:0;
    const paidDate=ex?ex.paidDate:null;
    const paymentMethod=ex?ex.paymentMethod:null;
    const paymentComments=ex?ex.paymentComments:null;
    const paymentScreenshot=ex?ex.paymentScreenshot:null;
    const updatedAt=ex?ex.updatedAt:null;
    const balance=round2(due-paid);
    const status=computeFlatStatus(balance,paid,carryForward,prevStatus);
    flats[f.id]={carryForward,due,paid,paidDate,balance,status,prevStatus,
                 paymentMethod,paymentComments,paymentScreenshot,updatedAt,penalty};
  }
  return flats;
}
function recomputeMonth(key,newTotal){
  const m=state.months[key];
  const total=newTotal!==undefined?newTotal:m.totalAmount;
  const baseShare=round2(total/TOTAL_FLATS);
  const prev=state.months[prevKeyOf(key)]||null;
  m.totalAmount=total; m.baseShare=baseShare;
  m.flats=computeMonthFlats(baseShare,prev,m.flats);
}
function propagateForward(fromKey){
  const idx=state.monthOrder.indexOf(fromKey);
  for(let i=idx+1;i<state.monthOrder.length;i++) recomputeMonth(state.monthOrder[i]);
}
async function createMonth(key,label,totalAmount,notes){
  state.months[key]={label,totalAmount:0,baseShare:0,notes:notes||'',hasBillFile:false,flats:{}};
  if(!state.monthOrder.includes(key)){state.monthOrder.push(key);state.monthOrder.sort();}
  recomputeMonth(key,totalAmount);
  propagateForward(key);
  await saveMonthToTurso(key);
  // propagated months also need saving
  const idx=state.monthOrder.indexOf(key);
  for(let i=idx+1;i<state.monthOrder.length;i++) await saveMonthToTurso(state.monthOrder[i]);
  // Snapshot the freshly created month
  await saveSnapshot(key,'create');
}
async function editMonthTotal(key,newTotal,prop){
  await saveSnapshot(key,'edit_total'); // snapshot BEFORE change
  recomputeMonth(key,newTotal);
  if(prop) propagateForward(key);
  await saveMonthToTurso(key);
  if(prop){const idx=state.monthOrder.indexOf(key);for(let i=idx+1;i<state.monthOrder.length;i++) await saveMonthToTurso(state.monthOrder[i]);}
}
async function recordPayment(key,flatId,amount,date,prop,method,comments,screenshotsJson,dueOverride){
  await saveSnapshot(key,'payment'); // snapshot BEFORE change
  const f=state.months[key].flats[flatId];
  if(dueOverride!=null) f.due=round2(dueOverride); // e.g. halved for a "No Occupancy" flat
  f.paid=round2(Math.max(0,amount));
  f.paidDate=f.paid>0?(date||new Date().toISOString().slice(0,10)):null;
  f.balance=round2(f.due-f.paid);
  f.status=computeFlatStatus(f.balance,f.paid,f.carryForward,f.prevStatus||null);
  // "Last Update" should reflect when this record was actually saved (real timestamp),
  // not the (user-editable, date-only) paidDate/bill date.
  f.updatedAt=new Date().toISOString();
  if(f.paid>0){
    f.paymentMethod=method||null;
    f.paymentComments=comments||null;
    // Store all receipt images as JSON array so every bill is preserved
    f.paymentScreenshot=screenshotsJson||null;
  }else{
    f.paymentMethod=null; f.paymentComments=null; f.paymentScreenshot=null;
  }
  if(prop) propagateForward(key);
  await saveMonthToTurso(key);
  if(prop){const idx=state.monthOrder.indexOf(key);for(let i=idx+1;i<state.monthOrder.length;i++) await saveMonthToTurso(state.monthOrder[i]);}
}

/* Parse paymentScreenshot field.
   Supports two formats:
   - Legacy: plain "data:image/..." string  → wrapped into single-item array
   - New:    JSON string of [{dataUrl,name,method,amount,date,billNo},...] */
function parseReceiptScreenshots(raw){
  if(!raw) return [];
  // Legacy plain data URL
  if(raw.startsWith('data:')||raw.startsWith('http'))
    return [{dataUrl:raw,name:'receipt.jpg',method:'',amount:0,date:'',billNo:''}];
  try{
    const arr=JSON.parse(raw);
    return Array.isArray(arr)?arr:[];
  }catch(e){
    return [{dataUrl:raw,name:'receipt.jpg',method:'',amount:0,date:'',billNo:''}];
  }
}
async function deleteMonth(key){
  await deleteMonthFromTurso(key);
  const idx=state.monthOrder.indexOf(key);
  state.monthOrder.splice(idx,1);
  delete state.months[key];
}

/* ============================================================
   IMAGE HELPERS
   ============================================================ */
function readFileAsDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read failed'));r.readAsDataURL(file);});}
function resizeImageDataUrl(dataUrl,maxDim=1200,quality=0.82){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let {width,height}=img;
      if(width>maxDim||height>maxDim){const s=maxDim/Math.max(width,height);width=Math.round(width*s);height=Math.round(height*s);}
      const c=document.createElement('canvas');c.width=width;c.height=height;
      c.getContext('2d').drawImage(img,0,0,width,height);
      res(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}
async function extractAmountFromImage(dataUrl,mediaType){
  const base64=dataUrl.split(',')[1];
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:200,messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:mediaType,data:base64}},
      {type:'text',text:'This is a water department utility bill. Find the total payable amount. Reply with ONLY the numeric amount — no ₹ symbol, no commas, no words. Example: 48250.50 . If unclear, reply exactly: UNKNOWN'}
    ]}]})
  });
  const data=await resp.json();
  return (data.content||[]).map(c=>c.text||'').join('').trim();
}

function renderSidebar(){

    list.innerHTML=`<div style="padding:16px 10px;color:var(--muted);font-size:11.5px;line-height:1.7;">Configure your Turso database using the ⚙ button above to get started.</div>`;
    return;
  }
  if(!state.monthOrder.length){
    list.innerHTML=`<div style="padding:16px 10px;color:var(--muted);font-size:11.5px;line-height:1.7;">${isAdmin()?'No billing months yet.<br>Click "+ New Month Bill" to start.':'No billing data. Admin must create the first bill.'}</div>`;
    return;
  }
  const latest=state.monthOrder[state.monthOrder.length-1];
  list.innerHTML=state.monthOrder.slice().reverse().map(key=>{
    const m=state.months[key];
    const collected=Object.values(m.flats).reduce((s,f)=>s+f.paid,0);
    const isCurrent=key===latest;
    const paidCt=Object.values(m.flats).filter(f=>f.status==='paid').length;
    return `<div class="month-item ${key===selectedMonth?'active':''}" data-key="${key}">
      <div class="mlabel"><span>${m.label}${m.isClosed?'<span class="closed-dot" title="Closed"></span>':''}</span><span class="mtag ${isCurrent?'current':''}">${isCurrent?'CURRENT':'ARCHIVED'}</span></div>

}

function refreshView(key,flatsArr){
  if(currentView==='grid') renderBlockGrid(key,flatsArr);
  else if(currentView==='table') renderTableView(key,flatsArr);
  else renderGalleryView(key,flatsArr);
}
function applyFilters(flatsArr){
  const search=filters.search.trim().toUpperCase();
  return flatsArr.filter(f=>{
    if(filters.block!=='ALL'&&f.block!==filters.block) return false;
    if(filters.status!=='ALL'&&f.status!==filters.status) return false;
    if(search&&!f.id.toUpperCase().includes(search)) return false;
    return true;
  });
}

/* ============================================================
   BLOCK GRID VIEW
   ============================================================ */
function renderBlockGrid(key,flatsArr){
  const container=document.getElementById('viewContainer');
  const m=state.months[key];
  const filtered=applyFilters(flatsArr);
  const filteredIds=new Set(filtered.map(f=>f.id));
  const admin=isAdmin();
  let html=`<div id="blockGrid">`;
  for(const b of BLOCKS){
    const blockFlats=flatsArr.filter(f=>f.block===b.block);
    if(filters.block!=='ALL'&&filters.block!==b.block) continue;
    const visible=blockFlats.filter(f=>filteredIds.has(f.id));
    if(!visible.length&&(filters.search||filters.status!=='ALL')) continue;
    const pCt=blockFlats.filter(f=>f.status==='paid').length;
    const partCt=blockFlats.filter(f=>f.status==='partial').length;
    html+=`<div class="block-card"><div class="bc-head">
      <span class="bname">BLOCK ${b.block}</span>
      <span class="bstats"><span style="color:var(--paid)">${pCt} paid</span> · <span style="color:var(--partial)">${partCt} partial</span> · <span style="color:var(--unpaid)">${blockFlats.length-pCt-partCt} unpaid</span></span>
    </div><div class="bc-body">`;
    for(const fl of FLOORS){
      const rowFlats=blockFlats.filter(f=>f.floor===fl.code&&filteredIds.has(f.id));
      if(!rowFlats.length) continue;
      html+=`<div class="bc-row"><div class="bc-floor">${fl.code}</div><div class="bc-tiles">`;
      for(const f of rowFlats){
        // For unpaid tiles when baseShare=0 (bill amount not set), show ₹20k default for display only
        const DEFAULT_SHARE=20000;
        const displayBal=(f.status!=='paid' && f.balance>0.004)
          ? f.balance
          : (f.status==='unpaid' && f.balance<=0.004 && m.baseShare===0)
            ? DEFAULT_SHARE : 0;
        const balStr=displayBal>0
          ? (displayBal>=1000?(displayBal/1000).toFixed(displayBal%1000===0?0:1)+'k':Math.round(displayBal))
          : '';
        const isDefault=(f.status==='unpaid' && m.baseShare===0 && displayBal===DEFAULT_SHARE);
        // Paid tiles show the total amount actually received, in bold black — same
        // spot/format as the balance figure shown on partial/unpaid tiles. When the
        // flat paid more than its Total Due (e.g. an extra receipt or Parking pushed
        // it over), prefix with "+" to show it as an excess rather than a plain figure.
        const isOverpaid=f.status==='paid' && f.paid>f.due+0.004;
        const paidStr=(f.status==='paid' && f.paid>0)
          ? (f.paid>=1000?(f.paid/1000).toFixed(f.paid%1000===0?0:1)+'k':Math.round(f.paid))
          : '';
        html+=`<div class="tile status-${f.status} ${admin?'admin-edit':''} ${f.paymentScreenshot?'has-bills':''}" data-flat="${f.id}" style="${isDefault?'opacity:.82;':''}" title="${isDefault?'Default ₹20,000 — bill amount not set yet':''}">
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1;">
            <b style="font-size:11.5px;">${f.num}</b>
            ${balStr?`<span style="font-size:8px;opacity:${isDefault?'.7':'.9'};font-weight:700;">${isDefault?'~':''}₹${balStr}</span>`:''}
            ${paidStr?`<span style="font-size:8px;font-weight:800;color:#000;">${isOverpaid?'+':''}₹${paidStr}</span>`:''}
          </div>
        </div>`;
      }
      html+=`</div></div>`;
    }
    html+=`</div></div>`;
  }
  html+=`</div>`;
  if(!filtered.length) html=`<div class="empty" style="padding:40px 0;">No flats match this filter.</div>`;
  container.innerHTML=html;
  const flatMap={};flatsArr.forEach(f=>flatMap[f.id]=f);
  container.querySelectorAll('.tile').forEach(tile=>{
    const fid=tile.dataset.flat,f=flatMap[fid];
    tile.addEventListener('mouseenter',e=>showTooltip(e,f));
    tile.addEventListener('mousemove',moveTooltip);
    tile.addEventListener('mouseleave',hideTooltip);
    if(admin) tile.addEventListener('click',()=>{hideTooltip();openPaymentModal(key,fid);});
  });
}
/* Formats a flat's "last updated" stamp as HTML: date in bold yellow, time in bold
   white. Falls back to paidDate (date only, no time) when updatedAt is missing. */
function formatUpdatedStamp(f){
  const labelHTML=`<b style="color:#ff8c00;font-weight:800;">🕐 Updated:</b>`;
  if(f.updatedAt){
    const d=new Date(f.updatedAt);
    const dateStr=fmtDDMMYYYY(d);
    const timeStr=d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    return `${labelHTML} <b style="color:var(--partial);font-weight:800;">${dateStr}</b> <b style="color:var(--text);font-weight:800;">${timeStr}</b>`;
  }
  if(f.paidDate){
    const dateStr=fmtDDMMYYYY(f.paidDate);
    return `${labelHTML} <b style="color:var(--partial);font-weight:800;">${dateStr}</b>`;
  }
  return '—';
}
/* Tooltip bill attachment cache: flatId -> {receipts, lastUpdated} */
const _ttBillCache={};

function showTooltip(e,f){
  const tt=document.getElementById('flatTooltip');
  const shots=parseReceiptScreenshots(f.paymentScreenshot);
  const hasReceipt=shots.length>0;
  if(hasReceipt) tt.classList.add('wide'); else tt.classList.remove('wide');

  // Build receipt thumbnails — all shown side by side
  let receiptHTML='';
  if(hasReceipt){
    // Store shots in window scope so click handlers (which run outside this fn) can access them
    window._ttShots=window._ttShots||{};
    window._ttShots[f.id]=shots;
    const thumbsHTML=shots.map((s,i)=>{
      if(!s.dataUrl) return '';
      const isImg=s.dataUrl.startsWith('data:image');
      const methodIcon=s.method==='upi'?'📱':s.method==='cash'?'💵':'';
      const label=s.billNo?'#'+s.billNo:(shots.length>1?'R'+(i+1):'Receipt');
      const amtStr=s.amount>0?('₹'+parseFloat(s.amount).toLocaleString('en-IN')):'';
      return isImg
        ?`<div class="tt-bill-item" data-flatid="${f.id}" data-idx="${i}">
            <img src="${s.dataUrl}" title="${label}${amtStr?' · '+amtStr:''}">
            ${methodIcon?`<span class="tt-bill-method">${methodIcon}</span>`:''}
            <div class="tt-bill-label">${label}${amtStr?' · '+amtStr:''}</div>
          </div>`
        :`<div class="tt-bill-pdf" title="${s.name||'PDF'}">📄</div>`;
    }).join('');
    const receiptCount=shots.length;
    receiptHTML=`
      <div class="tt-bills-section">
        <div class="tt-bills-title">📎 Receipt${receiptCount>1?'s ('+receiptCount+')':''}</div>
        <div class="tt-bill-strip">${thumbsHTML}</div>
      </div>`;
  }

  // Build carry-forward breakdown line
  const baseShareThisMonth=round2(f.due-(f.carryForward||0));
  const cfRow=f.carryForward>0.004
    ?`<div class="tt-row" style="color:var(--partial)"><span>↩ Carry Forward</span><b>${inr(f.carryForward)}</b></div>`
    :'';
  const fineRow=(f.penalty||0)>0.004
    ?`<div class="tt-row" style="color:var(--unpaid);"><span>⚠ Late Fine (incl. above)</span><b>${inr(f.penalty)}</b></div>`
    :'';
  // Previous month status badge for context
  const prevBadge=f.prevStatus
    ?`<div class="tt-row"><span>Prev Month</span><b style="color:${f.prevStatus==='paid'?'var(--paid)':f.prevStatus==='partial'?'var(--partial)':'var(--unpaid)'}">${f.prevStatus.toUpperCase()} last month</b></div>`
    :'';

  // Extra row: lifetime running total paid by this flat across every month on record
  const ledger=getFlatLedger(f.id);
  const lifetimePaid=ledger.length?ledger[ledger.length-1].total:0;
  const lifetimeRow=`<div class="tt-row" style="border-top:1px solid var(--border2);margin-top:4px;padding-top:6px;"><span>Total Paid Till Date</span><b style="color:var(--paid);">${inr(lifetimePaid)}</b></div>`;

  tt.innerHTML=`
    <div class="tt-title">Flat ${f.id} <span style="color:var(--muted);font-weight:400;font-size:11px;">(${f.floor})</span></div>
    <div class="tt-row"><span>Base Share</span><b>${inr(baseShareThisMonth)}</b></div>
    ${cfRow}
    ${fineRow}
    <div class="tt-row"><span>Total Due</span><b>${inr(f.due)}</b></div>
    <div class="tt-row"><span>Paid</span><b style="color:${f.paid>0?'var(--paid)':'var(--text)'}">${inr(f.paid)}</b></div>
    <div class="tt-row"><span>Balance</span><b style="color:${f.balance>0.004?'var(--unpaid)':'var(--paid)'}">${inrBalance(f.balance)}</b></div>
    <div class="tt-row"><span>Paid On</span><b>${f.paidDate?fmtDDMMYYYY(f.paidDate):'—'}</b></div>
    ${f.paymentMethod?`<div class="tt-row"><span>Method</span><b>${f.paymentMethod==='upi'?'📱 UPI':'💵 Cash'}</b></div>`:''}
    ${f.paymentMethod==='cash'&&f.paymentComments?`<div class="tt-row"><span>Comment</span><b style="font-weight:500;font-size:11px;">${f.paymentComments}</b></div>`:''}
    ${prevBadge}
    <div class="tt-status" style="color:${f.status==='paid'?'var(--paid)':f.status==='partial'?'var(--partial)':'var(--unpaid)'}">${f.status.toUpperCase()}</div>
    ${lifetimeRow}
    <div class="tt-bills-section" style="pointer-events:auto;padding-top:6px;border-top:none;"><span class="tt-stmt-link" data-flatid="${f.id}" style="font-size:11px;color:var(--accent2);font-weight:700;cursor:pointer;text-decoration:underline;">📜 View full payment statement</span></div>
    ${receiptHTML}
    <div class="tt-updated">${formatUpdatedStamp(f)}</div>`;

  const stmtLink=tt.querySelector('.tt-stmt-link');
  if(stmtLink) stmtLink.addEventListener('click',()=>{ hideTooltip(); openFlatStatementModal(stmtLink.dataset.flatid); });

  // Wire thumbnail clicks after innerHTML (pointer-events:auto on .tt-bills-section)
  tt.querySelectorAll('.tt-bill-item[data-flatid]').forEach(item=>{
    item.querySelector('img').addEventListener('click',()=>{
      const allShots=(window._ttShots&&window._ttShots[item.dataset.flatid])||[];
      const idx=parseInt(item.dataset.idx)||0;
      openImgPreview(item.dataset.flatid, allShots, idx);
    });
  });

  tt.style.display='block';
  moveTooltip(e);
}

/* openImgPreview(flatId, shotsOrSrc, startIdx, onClose)
   shotsOrSrc: array of {dataUrl,name,billNo,method,amount,date}  OR  a plain data-URL string (legacy)
   onClose: optional callback invoked instead of closeModal() when the preview is dismissed —
            used so a modal open "underneath" (e.g. the payment modal) can be rebuilt rather than wiped. */
function openImgPreview(flatId, shotsOrSrc, startIdx, onClose){
  hideTooltip();
  const dismiss=typeof onClose==='function'?onClose:closeModal;
  // Normalise to array
  let gallery=[];
  if(Array.isArray(shotsOrSrc)){
    gallery=shotsOrSrc.filter(s=>s&&s.dataUrl&&s.dataUrl.startsWith('data:image'));
  } else if(typeof shotsOrSrc==='string'&&shotsOrSrc.startsWith('data:')){
    gallery=[{dataUrl:shotsOrSrc,name:'receipt_'+flatId+'.jpg',billNo:'',method:'',amount:0,date:''}];
  }
  if(!gallery.length) return;
  let idx=Math.max(0,Math.min(parseInt(startIdx)||0, gallery.length-1));

  function filmstrip(){
    if(gallery.length<=1) return '';
    return `<div id="pvFilm" style="display:flex;gap:5px;overflow-x:auto;padding:8px 0;scrollbar-width:thin;">
      ${gallery.map((s,i)=>`
        <div class="pvf-thumb" data-i="${i}" style="flex-shrink:0;width:52px;height:52px;border-radius:6px;overflow:hidden;
            border:2px solid ${i===idx?'var(--accent2)':'var(--border2)'};cursor:pointer;transition:border-color .15s;">
          <img src="${s.dataUrl}" style="width:100%;height:100%;object-fit:cover;display:block;" draggable="false">
        </div>`).join('')}
    </div>`;
  }

  function refresh(){
    const s=gallery[idx];
    const billLbl=s.billNo?('Bill #'+s.billNo):'';
    const posLbl=gallery.length>1?(idx+1)+' / '+gallery.length:'';
    const meta=[billLbl, s.method?(s.method==='upi'?'📱 UPI':'💵 Cash'):'',
                s.amount?('₹'+parseFloat(s.amount).toLocaleString('en-IN')):'',s.date||'']
              .filter(Boolean).join(' · ');
    document.getElementById('pvImg').src=s.dataUrl;
    document.getElementById('pvLabel').textContent='📎 Flat '+flatId+(posLbl?' — '+posLbl:'')+(meta?' · '+meta:'');
    document.getElementById('pvDl').href=s.dataUrl;
    document.getElementById('pvDl').download=s.name||('receipt_'+flatId+'_'+(idx+1)+'.jpg');
    document.getElementById('pvPrev').style.opacity=idx>0?'1':'0.25';
    document.getElementById('pvNext').style.opacity=idx<gallery.length-1?'1':'0.25';
    // Filmstrip highlight
    document.querySelectorAll('.pvf-thumb').forEach((th,i)=>{
      th.style.borderColor=i===idx?'var(--accent2)':'var(--border2)';
    });
    const active=document.querySelector('.pvf-thumb[data-i="'+idx+'"]');
    if(active) active.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  }

  document.getElementById('modalRoot').innerHTML=`
    <div class="overlay" id="ov" style="z-index:1200;">
      <div class="modal" style="width:680px;max-width:96vw;padding:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;">
          <span id="pvLabel" style="font-size:12.5px;font-weight:700;color:var(--accent2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
          <button class="btn" id="closePreviewBtn" style="padding:5px 12px;flex-shrink:0;">✕ Close</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button id="pvPrev" style="flex-shrink:0;width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s;">‹</button>
          <img id="pvImg" src="" style="flex:1;min-width:0;max-width:100%;border-radius:10px;max-height:64vh;object-fit:contain;background:var(--panel2);display:block;">
          <button id="pvNext" style="flex-shrink:0;width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s;">›</button>
        </div>
        ${filmstrip()}
        <div class="modalbtns" style="margin-top:12px;">
          ${gallery.length>1?`<span style="font-size:12px;color:var(--muted);align-self:center;">← → to navigate · ${gallery.length} receipts</span>`:''}
          <a id="pvDl" href="" download="" class="btn primary" style="text-decoration:none;">⬇ Download</a>
        </div>
      </div>
    </div>`;

  refresh();
  document.querySelectorAll('.pvf-thumb').forEach(th=>{th.onclick=()=>{idx=parseInt(th.dataset.i);refresh();};});
  document.getElementById('closePreviewBtn').onclick=()=>{document.removeEventListener('keydown',onKey);dismiss();};
  document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov'){document.removeEventListener('keydown',onKey);dismiss();}});
  document.getElementById('pvPrev').onclick=()=>{if(idx>0){idx--;refresh();}};
  document.getElementById('pvNext').onclick=()=>{if(idx<gallery.length-1){idx++;refresh();}};
  const onKey=e=>{
    if(e.key==='ArrowLeft'&&idx>0){idx--;refresh();}
    if(e.key==='ArrowRight'&&idx<gallery.length-1){idx++;refresh();}
    if(e.key==='Escape'){document.removeEventListener('keydown',onKey);dismiss();}
  };
  document.addEventListener('keydown',onKey);
}

/* ============================================================
   FLAT PAYMENT LEDGER  (extra "statement" row per payment: date,
   amount, and a running total sum for that flat member across
   every month recorded — separate from the per-month totals above)
   ============================================================ */
function getFlatLedger(flatId){
  const rows=[];
  let running=0;
  for(const key of state.monthOrder){
    const m=state.months[key];
    const f=m.flats[flatId];
    if(f && f.paid>0){
      running=round2(running+f.paid);
      // If no specific paid-on date was recorded, default to the last day of that
      // month rather than leaving it blank.
      const rowDate=f.paidDate||getLastDayOfMonth(key).toISOString().slice(0,10);
      rows.push({monthKey:key,month:m.label,date:rowDate,time:f.updatedAt||null,amount:f.paid,total:running});
    }
  }
  return rows;
}
function openFlatStatementModal(flatId){
  const rows=getFlatLedger(flatId);
  const grandTotal=rows.length?rows[rows.length-1].total:0;
  const bodyRows=rows.map(r=>`<tr>
      <td>${r.month}</td>
      <td style="font-family:var(--font-mono);">${r.date?fmtDDMMYYYY(r.date):'—'}</td>
      <td class="num">${inr(r.amount)}</td>
      <td class="num" style="font-weight:700;">${inr(r.total)}</td>
    </tr>`).join('');
  document.getElementById('modalRoot').innerHTML=`
    <div class="overlay" id="ov"><div class="modal" style="width:520px;max-height:85vh;overflow-y:auto;">
      <h3>📜 Payment Statement — Flat ${flatId}</h3>
      <div class="hint" style="margin-top:0;margin-bottom:10px;">Every recorded payment for this flat, in order, with a running total.</div>
      <div class="table-wrap">
        <table style="min-width:100%;">
          <thead><tr><th>Month</th><th>Date</th><th class="num">Amount Paid</th><th class="num">Total Sum</th></tr></thead>
          <tbody>
            ${bodyRows||'<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:26px 10px;">No payments recorded yet for this flat.</td></tr>'}
            ${rows.length?`<tr style="border-top:2px solid var(--border2);"><td colspan="2" style="font-weight:800;">TOTAL PAID TO DATE</td><td class="num"></td><td class="num" style="font-weight:800;color:var(--paid);">${inr(grandTotal)}</td></tr>`:''}
          </tbody>
        </table>
      </div>
      <div class="modalbtns">
        <button class="btn" id="closeStmtBtn">Close</button>
        <button class="btn primary" id="downloadCertBtn">⬇ Download Certificate (PDF)</button>
      </div>
    </div></div>`;
  document.getElementById('closeStmtBtn').onclick=closeModal;
  document.getElementById('downloadCertBtn').onclick=()=>exportFlatCertificatePDF(flatId);
  document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});
}

/* ============================================================
   PER-FLAT MAINTENANCE REPORT CERTIFICATE (PDF)
   A running, ever-growing record for one flat — every month it has paid,
   with Amount Received, Date, and Time — using the same header/branding
   as the main billing statement export. Regenerating it after a new
   payment is recorded automatically includes the new month's row.
   ============================================================ */
function exportFlatCertificatePDF(flatId){
  const ledger=getFlatLedger(flatId);
  const grandTotal=ledger.length?ledger[ledger.length-1].total:0;
  const{jsPDF}=window.jspdf;const doc=new jsPDF();
  const pageW=doc.internal.pageSize.getWidth();

  // ── Header banner (same branding as the main billing statement) ──
  doc.setFillColor(26,19,48);
  doc.rect(0,0,pageW,36,'F');
  doc.setDrawColor(155,93,229);
  doc.setLineWidth(1.1);
  doc.line(0,36,pageW,36);
  try{ doc.addImage(LOGO_DATA_URL,'JPEG',12,6,24,24); }catch(e){}
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(14.5);
  doc.text(ASSOC_NAME,42,15);
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.setTextColor(190,205,225);
  doc.text('Maintenance Report Certificate',42,21.5);
  doc.setFontSize(8.5);
  doc.setTextColor(140,160,190);
  doc.text(`Flat ${flatId}   ·   Generated ${fmtDDMMYYYYTime(new Date())}`,42,27.5);

  // ── Certifying statement + total ──
  let y=46;
  doc.setTextColor(30,35,45);
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);
  doc.text(`This is to certify the maintenance payment record on file for Flat ${flatId}:`,14,y);
  y+=10;
  doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('Total Paid Till Date',14,y);
  doc.setFont('helvetica','normal');doc.setFontSize(11);
  doc.setTextColor(31,157,99);
  doc.text(inrPdf(grandTotal),14,y+6);
  doc.setTextColor(30,35,45);
  doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('Months on Record',80,y);
  doc.setFont('helvetica','normal');doc.setFontSize(11);
  doc.text(String(ledger.length),80,y+6);
  doc.setDrawColor(220,225,232);doc.setLineWidth(.3);doc.line(14,y+11,pageW-14,y+11);

  const rows=ledger.map(r=>{
    const timeStr=r.time?new Date(r.time).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}):'—';
    return[r.month,inrPdf(r.amount),r.date?fmtDDMMYYYY(r.date):'—',timeStr,inrPdf(r.total)];
  });
  doc.autoTable({
    startY:y+16,
    head:[['Month','Amount Received','Date','Time','Running Total']],
    body:rows.length?rows:[['No payments recorded yet','—','—','—','—']],
    styles:{fontSize:8.5,cellPadding:2.8,lineColor:[224,229,236],lineWidth:.15},
    headStyles:{fillColor:[26,19,48],textColor:255,fontStyle:'bold',fontSize:8.5},
    alternateRowStyles:{fillColor:[245,248,252]},
    didDrawPage(data){
      const pc=doc.internal.getNumberOfPages();
      doc.setFontSize(7.5);doc.setTextColor(150,158,170);doc.setFont('helvetica','normal');
      doc.text(`${ASSOC_NAME} · System-generated certificate`,14,doc.internal.pageSize.getHeight()-8);
      doc.text(`Page ${data.pageNumber} of ${pc}`,pageW-14,doc.internal.pageSize.getHeight()-8,{align:'right'});
    }
  });
  doc.save(`MaintenanceCertificate_${flatId}.pdf`);
  toast(`⬇ Certificate downloaded for Flat ${flatId}`,'ok');
}

function moveTooltip(e){
  const tt=document.getElementById('flatTooltip');
  const ttW=tt.classList.contains('wide')?420:220;
  const ttH=300;
  let x=e.clientX+18,y=e.clientY+18;
  if(x+ttW>window.innerWidth-12) x=e.clientX-ttW-8;
  if(y+ttH>window.innerHeight-12) y=e.clientY-ttH-8;
  if(x<8) x=8;
  if(y<8) y=8;
  tt.style.left=x+'px';tt.style.top=y+'px';
}
function hideTooltip(){document.getElementById('flatTooltip').style.display='none';}
