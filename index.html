/* ============================================================
   GALLERY VIEW  — shows only flats with paid/partial status & bill attachments
   ============================================================ */
function renderGalleryView(key,flatsArr){
  const container=document.getElementById('viewContainer');
  const admin=isAdmin();
  const m=state.months[key];
  const flatMapById={};flatsArr.forEach(f=>flatMapById[f.id]=f);

  // Gallery-specific filters (separate from controls)
  container.innerHTML=`
    <div class="gallery-filter-bar">
      <label>Status:</label>
      <select id="galStatusFilter">
        <option value="paid_partial">✅ Paid + 🟡 Partial</option>
        <option value="paid">✅ Paid only</option>
        <option value="partial">🟡 Partial only</option>
        <option value="ALL">All Statuses</option>
      </select>
      <label style="margin-left:8px;">Block:</label>
      <select id="galBlockFilter">
        <option value="ALL">All Blocks</option>
        ${BLOCKS.map(b=>`<option value="${b.block}">Block ${b.block}</option>`).join('')}
      </select>
      <label style="margin-left:8px;">Attachments:</label>
      <select id="galAttachFilter">
        <option value="ALL">All</option>
        <option value="with">With Receipt</option>
        <option value="without">Without Receipt</option>
      </select>
      <input type="text" id="galSearch" placeholder="🔍 Search flat…" style="margin-left:auto;width:150px;">
      <span id="galCount" style="font-size:11px;color:var(--muted);white-space:nowrap;"></span>
    </div>
    <div id="galleryView"></div>`;

  function renderCards(){
    const statusF=document.getElementById('galStatusFilter').value;
    const blockF=document.getElementById('galBlockFilter').value;
    const attachF=document.getElementById('galAttachFilter').value;
    const searchF=(document.getElementById('galSearch').value||'').trim().toUpperCase();

    let items=flatsArr.filter(f=>{
      if(statusF==='paid_partial'&&f.status==='unpaid') return false;
      if(statusF==='paid'&&f.status!=='paid') return false;
      if(statusF==='partial'&&f.status!=='partial') return false;
      if(blockF!=='ALL'&&f.block!==blockF) return false;
      if(attachF==='with'&&!f.paymentScreenshot) return false;
      if(attachF==='without'&&f.paymentScreenshot) return false;
      if(searchF&&!f.id.toUpperCase().includes(searchF)) return false;
      return true;
    });

    document.getElementById('galCount').textContent=items.length+' flat'+(items.length!==1?'s':'');

    const gv=document.getElementById('galleryView');
    if(!items.length){
      gv.innerHTML=`<div class="gallery-empty"><h3>No flats match this filter</h3><p>Try changing the status or attachment filter above.</p></div>`;
      return;
    }

    gv.innerHTML=items.map(f=>{
      const shots=parseReceiptScreenshots(f.paymentScreenshot);
      const imgShots=shots.filter(s=>s&&s.dataUrl&&s.dataUrl.startsWith('data:image'));
      const hasReceipt=shots.length>0;
      const hasImg=imgShots.length>0;
      // Thumb — show the actual png/jpeg receipt image when available (works for both
      // the new multi-receipt JSON array format and the legacy single data-URL string).
      let thumbHTML='';
      if(hasImg){
        thumbHTML=`<img src="${imgShots[0].dataUrl}" alt="Receipt ${f.id}">`;
      } else if(hasReceipt){
        thumbHTML=`<span class="gc-pdf-icon">📄</span>`;
      } else {
        const emoji=f.status==='paid'?'✅':f.status==='partial'?'🟡':'⬜';
        thumbHTML=`<span style="font-size:36px;">${emoji}</span>`;
      }
      // Method label
      const methodStr=f.paymentMethod==='upi'?'📱 UPI':f.paymentMethod==='cash'?'💵 Cash':'';
      // Comments short
      const shortComment=f.paymentComments?(f.paymentComments.length>50?f.paymentComments.slice(0,50)+'…':f.paymentComments):'';

      return `<div class="gallery-card" data-flat="${f.id}">
        <div class="gc-thumb">${thumbHTML}${hasReceipt?`<span class="gc-count">📎 ${shots.length>1?shots.length+' receipts':'receipt'}</span>`:''}</div>
        <div class="gc-body">
          <div class="gc-flat">
            <span>Flat ${f.id}</span>
            <span class="gc-status ${f.status}">${f.status.toUpperCase()}</span>
          </div>
          <div class="gc-meta">
            <span>Due: <b>${inr(f.due)}</b></span> &nbsp;·&nbsp; <span>Paid: <b style="color:var(--paid)">${inr(f.paid)}</b></span>
            ${f.balance>0.004?`&nbsp;·&nbsp;<span>Balance: <b style="color:var(--unpaid)">${inr(f.balance)}</b></span>`:''}
          </div>
          ${methodStr?`<div class="gc-meta">${methodStr}${shortComment?` — ${shortComment}`:''}</div>`:''}
          <div class="gc-updated">${formatUpdatedStamp(f)}</div>
        </div>
        <div class="gc-actions">
          ${hasImg?`<button class="gc-view-btn" data-flat="${f.id}">🔍 View Receipt</button>`:''}
          ${hasImg?`<button class="gc-dl-btn" data-flat="${f.id}" data-src="${encodeURIComponent(imgShots[0].dataUrl)}" data-name="${(imgShots[0].name||'receipt_'+f.id+'.jpg').replace(/"/g,'&quot;')}">⬇ Download</button>`:''}
          ${admin&&!m.isClosed?`<button class="gc-edit-btn" data-flat="${f.id}">✎ Edit</button>`:''}
          ${!hasReceipt&&!admin?`<span style="font-size:11px;color:var(--muted);text-align:center;width:100%;">No receipt attached</span>`:''}
        </div>
      </div>`;
    }).join('');

    // Wire card buttons
    gv.querySelectorAll('.gc-view-btn').forEach(btn=>{
      btn.onclick=()=>{
        const f=flatMapById[btn.dataset.flat];
        const shots=parseReceiptScreenshots(f.paymentScreenshot).filter(s=>s&&s.dataUrl&&s.dataUrl.startsWith('data:image'));
        openImgPreview(btn.dataset.flat,shots,0);
      };
    });
    gv.querySelectorAll('.gc-dl-btn').forEach(btn=>{
      btn.onclick=()=>{
        const src=decodeURIComponent(btn.dataset.src);
        const a=document.createElement('a');
        a.href=src;
        a.download=btn.dataset.name||('receipt_'+btn.dataset.flat+'.jpg');
        a.click();
      };
    });
    gv.querySelectorAll('.gc-edit-btn').forEach(btn=>{
      btn.onclick=()=>openPaymentModal(key,btn.dataset.flat);
    });
  }

  renderCards();
  document.getElementById('galStatusFilter').onchange=renderCards;
  document.getElementById('galBlockFilter').onchange=renderCards;
  document.getElementById('galAttachFilter').onchange=renderCards;
  document.getElementById('galSearch').oninput=renderCards;
}

function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function toast(msg,type='ok'){
  const t=document.createElement('div');
  t.className=`toast ${type}`;t.textContent=msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
function setBtnLoading(id,loading,label){
  const b=document.getElementById(id);if(!b)return;
  b.disabled=loading;
  b.innerHTML=loading?`<span class="spinner"></span>${label||'Saving…'}`:label||'Save';
}

/* ---- late-payment penalty config ---- */
async function saveLateFineAmount(amt){
  lateFineAmount=round2(Math.max(0,amt));
  await sql([{q:`INSERT OR REPLACE INTO app_settings (key,value) VALUES ('late_fine_amount', ?)`,params:[String(lateFineAmount)]}]);
}
async function recomputeAllOpenMonths(){
  // Walk months chronologically so each recompute sees the freshly-updated
  // previous month (needed for the fine to cascade/compound correctly).
  // Closed months are left untouched — their final figures don't change.
  for(const key of state.monthOrder){
    const m=state.months[key];
    if(m.isClosed) continue;
    recomputeMonth(key);
    await saveMonthToTurso(key);
  }
}
function openPenaltyConfigModal(){
  if(!isAdmin()){openLoginModal();return;}
  const unpaidNow=state.monthOrder.length
    ? Object.values(state.months[state.monthOrder[state.monthOrder.length-1]].flats).filter(f=>f.status==='unpaid').length
    : 0;
  document.getElementById('modalRoot').innerHTML=`
    <div class="overlay" id="ov"><div class="modal" style="width:420px;">
      <h3>⚙ Configure Late Penalties</h3>
      <div class="hint" style="margin-top:0;margin-bottom:12px;">
        Flats left fully <b style="color:var(--unpaid);">Unpaid</b> (🔴, ₹0 paid) at month-end get this fixed fine added on top of their carry-forward in <b>next month's bill</b>. If a flat stays unpaid again, the fine is added again — it compounds each consecutive unpaid month. Flats with a <b style="color:var(--partial);">Partial</b> payment are never fined.
      </div>
      <label>Late Fine Amount (₹) — 0 disables the fine</label>
      <input type="number" id="pfAmt" min="0" step="0.01" value="${lateFineAmount}" placeholder="e.g. 50">
      <div class="hint" style="margin-top:6px;">Currently <b style="color:var(--unpaid);">${unpaidNow}</b> flat${unpaidNow!==1?'s':''} unpaid in the latest month — saving will apply this fine to them starting next month's bill (and re-apply it to any already-created future months).</div>
      <div class="err" id="pfErr" style="margin-top:6px;"></div>
      <div class="modalbtns">
        <button class="btn" id="pfCancel">Cancel</button>
        <button class="btn primary" id="pfSave">Save</button>
      </div>
    </div></div>`;
  document.getElementById('pfCancel').onclick=closeModal;
  document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});
  document.getElementById('pfSave').onclick=async()=>{
    const val=parseFloat(document.getElementById('pfAmt').value);
    const errEl=document.getElementById('pfErr');
    if(isNaN(val)||val<0){errEl.textContent='Enter a valid amount (0 or more).';return;}
    setBtnLoading('pfSave',true,'Saving…');
    try{
      await saveLateFineAmount(val);
      await recomputeAllOpenMonths();
      closeModal();render();
      toast(val>0?`✅ Late fine set to ${inr(val)} — applied to open months`:'✅ Late fine disabled','ok');
    }catch(e){errEl.textContent='❌ Save failed: '+e.message;setBtnLoading('pfSave',false,'Save');}
  };
}

/* ---- new month ---- */
function openNewMonthModal(){
  if(!isAdmin()){openLoginModal();return;}
  const today=new Date();
  // Current calendar month — this is the MAXIMUM allowed month key
  const currentMonthKey=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  // Default to current month; if already exists, keep it selected (user sees the error on submit)
  const k=currentMonthKey;

  // Detect previous month and build inheritance preview
  const prevKey=state.monthOrder.length?state.monthOrder[state.monthOrder.length-1]:null;
  const prevMonth=prevKey?state.months[prevKey]:null;

  // Count inherited statuses from previous month
  let inheritRed=0,inheritYellow=0,inheritGreen=0;
  if(prevMonth){
    for(const f of ALL_FLATS){
      const pf=prevMonth.flats[f.id];
      const st=pf?pf.status:'unpaid';
      if(st==='paid') inheritGreen++;
      else if(st==='partial') inheritYellow++;
      else inheritRed++;
    }
  }

  // Build a compact mini-grid showing inherited colours from previous month
  function buildMiniGrid(previewBaseShare){
    if(!prevMonth) return '<div style="color:var(--muted);font-size:12px;text-align:center;padding:8px 0;">No previous month — all flats start fresh (🔴 unpaid).</div>';
    // Compute what new month flats would look like given this base share
    const previewFlats=computeMonthFlats(previewBaseShare||0, prevMonth, {});
    let rows='';
    for(const b of BLOCKS){
      const blockFlats=ALL_FLATS.filter(f=>f.block===b.block);
      let tiles='';
      for(const f of blockFlats){
        const pf=previewFlats[f.id];
        const st=pf?pf.status:'unpaid';
        const cf=pf?pf.carryForward:0;
        const bal=pf?pf.balance:0;
        const cfLabel=cf>0?`CF:${cf>=1000?(cf/1000).toFixed(1)+'k':Math.round(cf)}`:'';
        const balLabel=bal>0&&bal<999999?(bal>=1000?(bal/1000).toFixed(1)+'k':Math.round(bal)):'';
        // Tooltip via title
        const title=`Flat ${f.id} | ${st.toUpperCase()}${cf>0?' | CF: ₹'+cf.toLocaleString('en-IN'):''}${bal>0?' | Bal: ₹'+bal.toLocaleString('en-IN'):''}`;
        tiles+=`<div title="${title}" style="min-width:38px;height:34px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;line-height:1.1;padding:1px;
          background:${st==='paid'?'linear-gradient(145deg,#2ec27e,#1f9d63)':st==='partial'?'linear-gradient(145deg,#f0b429,#b3830a)':'linear-gradient(145deg,#f2555a,#b23238)'}"
          ><span>${f.num}</span>${balLabel?`<span style="font-size:7.5px;opacity:.9;">${st==='partial'?'₹'+balLabel:''}</span>`:''}${cfLabel&&st==='partial'?`<span style="font-size:6.5px;opacity:.75;">${cfLabel}</span>`:''}</div>`;
      }
      rows+=`<div style="margin-bottom:6px;"><div style="font-size:9px;color:var(--muted2);font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;">Block ${b.block}</div><div style="display:flex;gap:4px;flex-wrap:wrap;">${tiles}</div></div>`;
    }
    return rows;
  }

  const prevLabel=prevMonth?prevMonth.label:'—';
  const inheritSummary=prevMonth
    ? `<span style="color:var(--paid)">🟢 ${inheritGreen} paid</span> &nbsp;·&nbsp; <span style="color:var(--partial)">🟡 ${inheritYellow} partial</span> &nbsp;·&nbsp; <span style="color:var(--unpaid)">🔴 ${inheritRed} unpaid</span>`
    : '<span style="color:var(--muted)">No previous month</span>';

  document.getElementById('modalRoot').innerHTML=`
    <div class="overlay" id="ov"><div class="modal" style="width:520px;max-height:92vh;overflow-y:auto;">
      <h3>➕ New Monthly Bill</h3>

      <!-- Live date/time display -->
      <div id="liveClockBar" style="background:var(--panel2);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;">🕐 System Date &amp; Time</span>
        <span id="liveClock" style="font-size:13px;font-weight:800;color:var(--accent2);font-variant-numeric:tabular-nums;"></span>
      </div>
      <div class="hint" style="margin-top:0;margin-bottom:10px;">Bills can only be created for the <b>current calendar month</b>. Future months are not allowed.</div>

      <label>Billing Month</label>
      <input type="month" id="mMonth" value="${k}" max="${k}" min="${k}" readonly style="background:var(--panel3);cursor:not-allowed;opacity:.85;">
      <div class="hint" style="margin-top:3px;color:var(--accent2);">📅 Locked to current month: <b>${new Date().toLocaleString('en-IN',{month:'long',year:'numeric'})}</b></div>

      <label>Maintenance Amount per Flat (₹)</label>
      <input type="number" id="mTotal" min="0" step="0.01" placeholder="e.g. 800" value="${prevMonth&&prevMonth.baseShare?prevMonth.baseShare:''}">
      <div id="mShareHint" class="hint" style="margin-top:4px;"></div>
      <div class="hint" style="margin-top:2px;">This amount is applied equally to all ${TOTAL_FLATS} flats. Any unpaid balance from last month is added on top automatically (carry-forward). Late-payment penalties can be configured by Admin in a future update.</div>

      <!-- Inherited status preview from previous month -->
      <div style="margin-top:14px;background:var(--panel2);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;">
        <div style="font-size:11px;font-weight:800;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">
          📋 Inherited from ${prevLabel}
        </div>
        <div style="font-size:12px;margin-bottom:10px;">${inheritSummary}</div>
        <div style="font-size:10.5px;color:var(--muted);margin-bottom:8px;line-height:1.5;">
          🟡 <b>Yellow</b> flats carry their partial balance forward (balance shown on tile).<br>
          🔴 <b>Red</b> flats from last month stay red — <b>only the new month balance</b> is added.<br>
          🟢 <b>Green</b> flats reset to red (fresh start this month).
        </div>
        <div id="miniGrid" style="max-height:240px;overflow-y:auto;">${buildMiniGrid(0)}</div>
      </div>

      <div class="err" id="mErr"></div>
      <div class="modalbtns">
        <button class="btn" id="cancelBtn">Cancel</button>
        <button class="btn primary" id="createBtn">Create Bill</button>
      </div>
    </div></div>`;

  document.getElementById('cancelBtn').onclick=()=>{clearInterval(clockTimer);closeModal();};
  document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov'){clearInterval(clockTimer);closeModal();}});

  // Live clock
  function updateClock(){
    const now=new Date();
    const el=document.getElementById('liveClock');
    if(el) el.textContent=now.toLocaleString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  }
  updateClock();
  const clockTimer=setInterval(updateClock,1000);

  // Live mini-grid preview update as the per-flat amount is typed
  document.getElementById('mTotal').addEventListener('input',()=>{
    const share=round2(parseFloat(document.getElementById('mTotal').value)||0);
    const hint=document.getElementById('mShareHint');
    hint.textContent=share>0?`Total collectible this month: ${inr(round2(share*TOTAL_FLATS))} (${inr(share)} × ${TOTAL_FLATS} flats)`:'';
    document.getElementById('miniGrid').innerHTML=buildMiniGrid(share);
  });
  document.getElementById('mTotal').dispatchEvent(new Event('input'));

  document.getElementById('createBtn').onclick=async()=>{
    const mv=document.getElementById('mMonth').value;
    const perFlat=parseFloat(document.getElementById('mTotal').value);
    const errEl=document.getElementById('mErr');
    if(!mv){errEl.textContent='Select a month';return;}
    // Strict: only current calendar month allowed
    const nowKey=(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;})();
    if(mv!==nowKey){errEl.textContent=`❌ Only the current month (${monthLabel(nowKey)}) can be created. Future or past months are not allowed.`;return;}
    if(state.months[mv]){errEl.textContent=`Bill for ${monthLabel(mv)} already exists`;return;}
    if(isNaN(perFlat)||perFlat<0){errEl.textContent='Enter a valid maintenance amount';return;}
    clearInterval(clockTimer);
    setBtnLoading('createBtn',true,'Saving to Turso…');
    try{
      // Admin sets the per-flat maintenance amount directly; internally we still store
      // a "total" (= perFlat × TOTAL_FLATS) so all the existing carry-forward, snapshot,
      // and export logic — which works off totalAmount/baseShare — keeps working unchanged.
      await createMonth(mv,monthLabel(mv),round2(perFlat*TOTAL_FLATS));
      selectedMonth=mv;closeModal();render();toast(`✅ ${monthLabel(mv)} maintenance bill created — ${inr(perFlat)} per flat`,'ok');
    }catch(e){errEl.textContent='❌ Save failed: '+e.message;setBtnLoading('createBtn',false,'Create Bill');}
  };
}

/* ---- payment modal ---- */
function openPaymentModal(key,flatId){
  if(!isAdmin()){openLoginModal();return;}
  const m=state.months[key],f=m.flats[flatId];
  const isLast=key===state.monthOrder[state.monthOrder.length-1];
  const cur=f.status;
  const todayStr=new Date().toISOString().slice(0,10);

  // Parking charge — a flat ₹300 (editable) add-on, ticked on/off by admin, auto-summed
  // into the total only when checked. On edit, recover its on/off state + amount from a
  // "Parking: ₹NNN" marker appended to paymentComments at save time (see save handler below).
  let parkingEnabled=false, parkingAmount=300;
  if(f.paid>0 && f.paymentComments){
    const pm=f.paymentComments.match(/Parking:\s*₹?\s*([\d.]+)/i);
    if(pm){ parkingEnabled=true; parkingAmount=round2(parseFloat(pm[1])||300); }
  }

  // No Occupancy — halves this flat's Total Due for the month (e.g. ₹800 → ₹400).
  // originalDue always holds the flat's true, un-halved due; recovered from a
  // "NoOccupancy|FullDue:NNN" marker on edit so re-toggling never compounds the reduction.
  let noOccupancy=false, originalDue=f.due;
  if(f.paid>0 && f.paymentComments){
    const om=f.paymentComments.match(/NoOccupancy\|FullDue:([\d.]+)/i);
    if(om){ noOccupancy=true; originalDue=round2(parseFloat(om[1])||f.due*2); }
  }
  function effectiveDue(){
    const chk=document.getElementById('pOccupancyChk');
    const on=chk?chk.checked:noOccupancy;
    return on?round2(originalDue/2):originalDue;
  }

  // Multi-receipt rows: each row has date, billNo, amount, method, imageDataUrl.
  // For a brand-new payment (nothing recorded yet), prefill the amount with the flat's
  // full due (halved if No Occupancy is already set) so a straight "Save" records a
  // full payment by default — admin only needs to edit it down for a Partial payment,
  // or clear it to 0, for the status to auto-adjust to Partial/Unpaid accordingly.
  const defaultAmount=f.paid>0?'':String(noOccupancy?round2(originalDue/2):originalDue);
  let receipts=[{uid:'r0',date:f.paidDate||todayStr,billNo:'',amount:defaultAmount,method:f.paymentMethod||'',imageDataUrl:null,imageName:null}];

  // If editing existing payment, restore ALL receipt rows from stored JSON array
  if(f.paid>0){
    const stored=parseReceiptScreenshots(f.paymentScreenshot);

    if(stored.length>1){
      // Multiple receipts stored — restore each as its own row.
      // Parse paymentComments to recover per-receipt metadata when JSON lacks it.
      // Comments format: "Receipt 1 | Bill#X | date | METHOD ; Receipt 2 | ..."
      const commentRows=(f.paymentComments||'').split(';').map(s=>s.trim());
      function extractFromComment(commentRow){
        const billM=commentRow.match(/Bill#([^\s|;]+)/);
        const dateM=commentRow.match(/(\d{4}-\d{2}-\d{2})/);
        const methodM=commentRow.match(/(UPI|CASH)/i);
        return{
          billNo:billM?billM[1]:'',
          date:dateM?dateM[1]:'',
          method:methodM?methodM[1].toLowerCase():''
        };
      }
      const totalStored=stored.reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
      const perRowAmt=totalStored>0?null:round2(f.paid/stored.length);
      receipts=stored.map((s,i)=>{
        const comment=commentRows[i]||'';
        const fromComment=extractFromComment(comment);
        return{
          uid:'r_loaded_'+i,
          date:s.date||fromComment.date||f.paidDate||todayStr,
          billNo:s.billNo||fromComment.billNo||'',
          amount:s.amount>0?s.amount:(perRowAmt||''),
          method:s.method||fromComment.method||f.paymentMethod||'',
          imageDataUrl:s.dataUrl||null,
          imageName:s.name||('receipt_'+flatId+'_'+(i+1)+'.jpg')
        };
      });
    } else if(stored.length===1){
      // Single stored receipt (new or legacy) — one row with full amount
      const s=stored[0];
      // Try to recover billNo from paymentComments if not stored in JSON
      let recoveredBillNo=s.billNo||'';
      if(!recoveredBillNo&&f.paymentComments){
        const m=f.paymentComments.match(/Bill#([^\s|;]+)/);
        if(m) recoveredBillNo=m[1];
      }
      receipts[0].amount=s.amount>0?s.amount:round2(f.paid-(parkingEnabled?parkingAmount:0));
      receipts[0].method=s.method||f.paymentMethod||'';
      receipts[0].imageDataUrl=s.dataUrl||null;
      receipts[0].imageName=s.name||('receipt_'+flatId+'.jpg');
      receipts[0].date=s.date||f.paidDate||todayStr;
      receipts[0].billNo=recoveredBillNo;
    } else {
      // No screenshot stored — still restore financial data
      receipts[0].amount=round2(f.paid-(parkingEnabled?parkingAmount:0));
      receipts[0].method=f.paymentMethod||'';
      receipts[0].date=f.paidDate||todayStr;
    }
  }

  function currentParking(){
    const chk=document.getElementById('pParkingChk');
    const amtEl=document.getElementById('pParkingAmt');
    const on=chk?chk.checked:parkingEnabled;
    const amt=on?round2(parseFloat(amtEl?amtEl.value:parkingAmount)||0):0;
    return{on,amt};
  }
  function rowsTotal(){ return round2(receipts.reduce((s,r)=>s+(parseFloat(r.amount)||0),0)+currentParking().amt); }

  function autoStatus(){
    const tot=rowsTotal();
    return computeFlatStatus(round2(effectiveDue()-tot),tot,f.carryForward,f.prevStatus||null);
  }

  function receiptRowHTML(r,idx){
    const hasImg=!!r.imageDataUrl;
    return `<div class="pay-receipt-row" data-uid="${r.uid}" style="background:var(--panel3);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;margin-bottom:8px;">
      <!-- Row header: bill no + date + delete -->
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
        <input type="text" class="pr-billno" data-uid="${r.uid}" value="${r.billNo||''}" placeholder="Bill / Ref No. (optional)" style="flex:1;padding:7px 10px;border-radius:7px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:12.5px;">
        <input type="date" class="pr-date" data-uid="${r.uid}" value="${r.date||todayStr}" style="flex:1;padding:7px 10px;border-radius:7px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:12.5px;">
        ${receipts.length>1?`<button class="pr-del" data-uid="${r.uid}" style="background:none;border:none;color:var(--unpaid);font-size:17px;cursor:pointer;padding:2px 5px;border-radius:5px;" title="Remove">✕</button>`:'<span style="width:24px;"></span>'}
      </div>
      <!-- Amount + Method -->
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
        <div style="position:relative;flex:1;">
          <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none;">₹</span>
          <input type="number" class="pr-amt" data-uid="${r.uid}" value="${r.amount||''}" placeholder="Amount" min="0" step="0.01"
            style="width:100%;padding:7px 10px 7px 22px;border-radius:7px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:13px;box-sizing:border-box;">
        </div>
        <select class="pr-method" data-uid="${r.uid}" style="flex:1;padding:7px 10px;border-radius:7px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:12.5px;">
          <option value="">— Method —</option>
          <option value="cash" ${r.method==='cash'?'selected':''}>💵 Cash</option>
          <option value="upi" ${r.method==='upi'?'selected':''}>📱 UPI</option>
        </select>
      </div>
      <!-- Receipt attachment -->
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <button class="pr-attach" data-uid="${r.uid}" style="display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;border:2px dashed ${hasImg?'var(--accent2)':'var(--border2)'};background:${hasImg?'rgba(123,63,196,.12)':'transparent'};color:${hasImg?'var(--accent2)':'var(--muted)'};font-size:12px;cursor:pointer;white-space:nowrap;">
          ${hasImg?'🖼 Change Receipt':'📎 Attach receipt'}
        </button>
        <input type="file" class="pr-file" data-uid="${r.uid}" accept="image/*" capture="environment" style="display:none;">
        ${hasImg
          ?`<div style="display:flex;align-items:center;gap:6px;">
              <img src="${r.imageDataUrl}" style="height:44px;width:44px;object-fit:cover;border-radius:6px;border:1px solid var(--accent2);cursor:pointer;" class="pr-img-preview" data-uid="${r.uid}" title="Click to enlarge">
              <div style="display:flex;flex-direction:column;gap:3px;">
                <button class="pr-dl" data-uid="${r.uid}" style="background:var(--panel3);border:1px solid var(--border2);color:var(--accent2);font-size:11px;border-radius:5px;padding:3px 8px;cursor:pointer;" title="Download receipt">⬇ Download</button>
                <button class="pr-clr" data-uid="${r.uid}" style="background:none;border:1px solid rgba(242,85,90,.3);color:var(--unpaid);font-size:11px;border-radius:5px;padding:3px 8px;cursor:pointer;" title="Remove receipt">✕ Remove</button>
              </div>
            </div>`
          :'<span style="font-size:11px;color:var(--muted);">Photo or screenshot (optional)</span>'}
      </div>
    </div>`;
  }

  function renderReceipts(){
    document.getElementById('payReceiptsEl').innerHTML=receipts.map((r,i)=>receiptRowHTML(r,i)).join('');
    wireReceiptRows();
    refreshPaySummary();
  }

  function refreshPaySummary(){
    const tot=rowsTotal();
    const{on:parkingOn,amt:parkingAmt}=currentParking();
    const dDue=effectiveDue();
    const status=autoStatus();
    const statusColor=status==='paid'?'var(--paid)':status==='partial'?'var(--partial)':'var(--unpaid)';
    const statusLabel=status==='paid'?'✅ Fully Paid':status==='partial'?'🟡 Partially Paid':'🔴 Unpaid';
    document.getElementById('paySummaryEl').innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;">
        <span style="color:var(--muted);">Total Due${dDue<originalDue?' (No Occupancy)':''}</span>
        <span style="font-weight:700;">${dDue<originalDue?`<s style="opacity:.55;font-weight:400;margin-right:5px;">${inr(originalDue)}</s>`:''}${inr(dDue)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;border-top:1px solid var(--border2);">
        <span style="color:var(--muted);">Receipts (${receipts.length} receipt${receipts.length>1?'s':''})</span>
        <span style="font-weight:700;color:var(--paid);">${inr(round2(receipts.reduce((s,r)=>s+(parseFloat(r.amount)||0),0)))}</span>
      </div>
      ${parkingOn?`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;">
        <span style="color:var(--muted);">🅿️ Parking Charge</span>
        <span style="font-weight:700;color:var(--accent2);">${inr(parkingAmt)}</span>
      </div>`:''}
      <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;border-top:1px solid var(--border2);">
        <span style="color:var(--muted);">Total Received</span>
        <span style="font-weight:800;color:var(--paid);">${inr(tot)}</span>
      </div>
      ${tot>0&&tot<dDue?`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;">
        <span style="color:var(--muted);">Balance Remaining</span>
        <span style="font-weight:700;color:var(--partial);">${inr(round2(dDue-tot))}</span>
      </div>`:''}
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0 2px;font-size:13px;border-top:1px solid var(--border2);margin-top:2px;">
        <span style="color:var(--muted);">Status</span>
        <span style="font-weight:800;color:${statusColor};">${statusLabel}</span>
      </div>`;
    const sb=document.getElementById('saveBtn');
    if(sb) sb.disabled=false;
  }

  function wireReceiptRows(){
    // Attach button → file input
    document.querySelectorAll('.pr-attach').forEach(btn=>{
      btn.onclick=()=>{
        const inp=document.querySelector(`.pr-file[data-uid="${btn.dataset.uid}"]`);
        if(inp) inp.click();
      };
    });
    // File inputs
    document.querySelectorAll('.pr-file').forEach(inp=>{
      inp.onchange=async(e)=>{
        const file=e.target.files[0]; if(!file) return;
        const row=receipts.find(r=>r.uid===inp.dataset.uid); if(!row) return;
        try{
          const raw=await readFileAsDataUrl(file);
          row.imageDataUrl=await resizeImageDataUrl(raw,1000,0.82);
          row.imageName=file.name;
          renderReceipts();
        }catch(err){ toast('⚠ Could not read image','err'); }
        e.target.value='';
      };
    });
    // Image preview — open full gallery lightbox at clicked receipt's position
    document.querySelectorAll('.pr-img-preview').forEach(img=>{
      img.onclick=()=>{
        const r=receipts.find(x=>x.uid===img.dataset.uid);
        const gallery=receipts.filter(x=>x.imageDataUrl).map(x=>({
          dataUrl:x.imageDataUrl, name:x.imageName||'receipt.jpg',
          billNo:x.billNo||'', amount:parseFloat(x.amount)||0,
          method:x.method||'', date:x.date||''
        }));
        const si=gallery.findIndex(g=>r&&g.dataUrl===r.imageDataUrl);
        // Pass buildModal as the close callback so dismissing the zoomed receipt
        // rebuilds the Payment Details modal instead of leaving it closed.
        openImgPreview(flatId, gallery, Math.max(0,si), buildModal);
      };
    });
    // Download receipt
    document.querySelectorAll('.pr-dl').forEach(btn=>{
      btn.onclick=()=>{
        const r=receipts.find(x=>x.uid===btn.dataset.uid); if(!r||!r.imageDataUrl) return;
        const a=document.createElement('a');
        a.href=r.imageDataUrl;
        a.download=r.imageName||('receipt_'+flatId+'_'+r.uid+'.jpg');
        a.click();
      };
    });
    // Remove/clear receipt
    document.querySelectorAll('.pr-clr').forEach(btn=>{
      btn.onclick=()=>{
        const r=receipts.find(x=>x.uid===btn.dataset.uid); if(!r) return;
        r.imageDataUrl=null; r.imageName=null;
        renderReceipts();
      };
    });
    // Bill no
    document.querySelectorAll('.pr-billno').forEach(inp=>{
      inp.oninput=()=>{ const r=receipts.find(x=>x.uid===inp.dataset.uid); if(r) r.billNo=inp.value; };
    });
    // Date
    document.querySelectorAll('.pr-date').forEach(inp=>{
      inp.onchange=()=>{ const r=receipts.find(x=>x.uid===inp.dataset.uid); if(r) r.date=inp.value; };
    });
    // Amount → live sum
    document.querySelectorAll('.pr-amt').forEach(inp=>{
      inp.oninput=()=>{ const r=receipts.find(x=>x.uid===inp.dataset.uid); if(r) r.amount=inp.value; refreshPaySummary(); };
    });
    // Method
    document.querySelectorAll('.pr-method').forEach(sel=>{
      sel.onchange=()=>{ const r=receipts.find(x=>x.uid===sel.dataset.uid); if(r) r.method=sel.value; };
    });
    // Delete row
    document.querySelectorAll('.pr-del').forEach(btn=>{
      btn.onclick=()=>{
        receipts=receipts.filter(r=>r.uid!==btn.dataset.uid);
        renderReceipts();
      };
    });
  }

  const isEditing=f.paid>0;

  // Builds (or rebuilds) the full modal shell. Kept as a named function — rather than an
  // inline block run once — so that closing the receipt zoom/lightbox (which fully replaces
  // #modalRoot) can call this again to restore the Payment Details modal instead of leaving it closed.
  function buildModal(){
    document.getElementById('modalRoot').innerHTML=`
      <div class="overlay" id="ov"><div class="modal" style="width:500px;max-height:90vh;overflow-y:auto;">
        <h3>${isEditing?'✏️ Edit Payment':'💳 Record Payment'} — ${flatId}</h3>
        ${isEditing?`<div style="background:rgba(123,63,196,.1);border:1px solid rgba(123,63,196,.25);border-radius:8px;padding:7px 12px;margin-bottom:10px;font-size:12px;color:var(--accent2);">
          ℹ️ Editing existing payment — previous data has been pre-loaded. Attachments are ready to view or download.
        </div>`:''}
        <div style="background:var(--panel3);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:12.5px;color:var(--muted);">
          Standard Due: <strong style="color:var(--text)">${inr(originalDue)}</strong>
          <span style="margin-left:8px;font-size:11.5px;">(base ${inr(round2(originalDue-f.carryForward))}${f.carryForward>0?' + carry-forward '+inr(f.carryForward):''})</span>
        </div>

        <div style="font-size:12px;color:var(--accent2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">Receipts</div>
        <div id="payReceiptsEl"></div>

        <button class="btn" id="addReceiptBtn" style="margin-bottom:14px;font-size:12.5px;padding:7px 14px;border-style:dashed;">+ Add Receipt</button>

        <div style="display:flex;align-items:center;gap:10px;background:var(--panel3);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;margin-bottom:14px;">
          <input type="checkbox" id="pParkingChk" ${parkingEnabled?'checked':''} style="width:17px;height:17px;flex-shrink:0;cursor:pointer;">
          <label for="pParkingChk" style="margin:0;font-size:12.5px;flex:1;cursor:pointer;">🅿️ Include Parking Charge</label>
          <div style="position:relative;">
            <span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none;">₹</span>
            <input type="number" id="pParkingAmt" value="${parkingAmount}" min="0" step="0.01" ${parkingEnabled?'':'disabled'}
              style="width:100px;padding:6px 8px 6px 20px;border-radius:7px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:12.5px;box-sizing:border-box;opacity:${parkingEnabled?'1':'.55'};">
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:10px;background:var(--panel3);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;margin-bottom:14px;">
          <input type="checkbox" id="pOccupancyChk" ${noOccupancy?'checked':''} style="width:17px;height:17px;flex-shrink:0;cursor:pointer;">
          <label for="pOccupancyChk" style="margin:0;font-size:12.5px;flex:1;cursor:pointer;">🏠 No Occupancy — 50% Maintenance Reduction</label>
          <span id="pOccupancyNote" style="font-size:11.5px;color:var(--muted);white-space:nowrap;"></span>
        </div>

        <div id="paySummaryEl" style="background:var(--panel3);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;margin-bottom:4px;"></div>

        ${!isLast?`<div class="checkrow" style="margin-top:10px;"><input type="checkbox" id="pPropagate" checked><label for="pPropagate" style="margin:0;font-size:12.5px;">Recalculate carry-forward in later months</label></div>`:''}
        <div class="err" id="pErr" style="margin-top:6px;"></div>
        <div class="modalbtns">
          <button class="btn" id="cancelBtn">Cancel</button>
          <button class="btn primary" id="saveBtn">Save Payment</button>
        </div>
      </div></div>`;

    document.getElementById('cancelBtn').onclick=closeModal;
    document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});
    document.getElementById('addReceiptBtn').onclick=()=>{
      receipts.push({uid:'r_'+Date.now(),date:todayStr,billNo:'',amount:'',method:'',imageDataUrl:null,imageName:null});
      renderReceipts();
      const el=document.getElementById('payReceiptsEl');
      if(el&&el.lastElementChild) el.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});
    };

    // Parking charge — ticking it in/out (or editing the amount) live-updates the auto-summed total
    document.getElementById('pParkingChk').onchange=(e)=>{
      const amtEl=document.getElementById('pParkingAmt');
      amtEl.disabled=!e.target.checked;
      amtEl.style.opacity=e.target.checked?'1':'.55';
      refreshPaySummary();
    };
    document.getElementById('pParkingAmt').oninput=refreshPaySummary;

    // No Occupancy — halves the Total Due used for balance/status the moment it's ticked
    function refreshOccupancyNote(){
      const on=document.getElementById('pOccupancyChk').checked;
      document.getElementById('pOccupancyNote').innerHTML=on
        ? `<s style="opacity:.6;">${inr(originalDue)}</s> → <b style="color:var(--accent2);">${inr(round2(originalDue/2))}</b>`
        : `Standard due: <b>${inr(originalDue)}</b>`;
    }
    document.getElementById('pOccupancyChk').onchange=()=>{ refreshOccupancyNote(); refreshPaySummary(); };
    refreshOccupancyNote();

    document.getElementById('saveBtn').onclick=async()=>{
      const errEl=document.getElementById('pErr');
      const tot=rowsTotal();
      const status=autoStatus();

      // Validation — receipt/bill attachment is OPTIONAL for maintenance payments;
      // only a payment method is required for any entry with an amount.
      if(status!=='unpaid'){
        const noMethod=receipts.filter(r=>parseFloat(r.amount)>0&&!r.method);
        if(noMethod.length){ errEl.textContent='Select a payment method for each receipt with an amount.'; return; }
      }

      const prop=document.getElementById('pPropagate')?document.getElementById('pPropagate').checked:true;

      // Build combined comments from bill nos and methods
      const comments=receipts.filter(r=>parseFloat(r.amount)>0).map((r,i)=>{
        const parts=[`Receipt ${i+1}`];
        if(r.billNo) parts.push(`Bill#${r.billNo}`);
        if(r.date) parts.push(r.date);
        if(r.method) parts.push(r.method.toUpperCase());
        return parts.join(' | ');
      }).join(' ; ');
      const{on:parkingOn,amt:parkingAmt}=currentParking();
      const noOcc=document.getElementById('pOccupancyChk').checked;
      let commentsFinal=parkingOn&&parkingAmt>0
        ? (comments?comments+' ; ':'')+`Parking: ₹${parkingAmt.toFixed(2)}`
        : comments;
      if(noOcc) commentsFinal=(commentsFinal?commentsFinal+' ; ':'')+`NoOccupancy|FullDue:${originalDue.toFixed(2)}`;

      // Serialise ALL receipts (images + metadata) as a JSON array — every bill is preserved
      const activeReceipts=receipts.filter(r=>parseFloat(r.amount)>0);
      const screenshotsArr=activeReceipts.map(r=>({
        dataUrl:r.imageDataUrl||null,
        name:r.imageName||('receipt_'+flatId+'.jpg'),
        method:r.method||'',
        amount:parseFloat(r.amount)||0,
        date:r.date||todayStr,
        billNo:r.billNo||''
      }));
      const screenshotsJson=screenshotsArr.length?JSON.stringify(screenshotsArr):null;
      const method=activeReceipts.find(r=>r.method)?.method||null;
      const date=activeReceipts.find(r=>r.date)?.date||todayStr;

      setBtnLoading('saveBtn',true,'Saving…');
      try{
        await recordPayment(key,flatId,tot,date,prop,method,commentsFinal,screenshotsJson,noOcc?round2(originalDue/2):originalDue);
        const rCount=receipts.filter(r=>parseFloat(r.amount)>0).length;
        closeModal();render();toast(`✅ ${flatId} — ${inr(tot)} saved (${rCount} receipt${rCount>1?'s':''}${parkingOn&&parkingAmt>0?' + Parking':''}${noOcc?' + No Occupancy':''})`, 'ok');
      }catch(e){ errEl.textContent='❌ Save failed: '+e.message; setBtnLoading('saveBtn',false,'Save Payment'); }
    };

    renderReceipts();
  }

  buildModal();
}

/* ════════ CLOSE MONTH MODAL ════════ */
async function openCloseMonthModal(key){
  if(!isAdmin()) return;
  const m=state.months[key];
  const lastDay=getLastDayOfMonth(key);
  const today=new Date();
  const todayStr=today.toISOString().slice(0,10);
  const cs=getMonthCloseStatus(key);

  // Financial
  const flatsArr=ALL_FLATS.map(f=>({...f,...m.flats[f.id]}));
  const collected   =round2(flatsArr.reduce((s,f)=>s+f.paid,0));
  const pendingDues =round2(flatsArr.reduce((s,f)=>s+f.balance,0));

  // Load existing society expense records from DB
  let savedBills=[];
  try{ savedBills=await getBwssBills(key); }catch(e){}

  // Each row: {uid, files:[{fileData,fileType,fileName}], date, amount, dbId?}
  let rows=savedBills.length
    ? savedBills.map(b=>({uid:'saved_'+b.id, dbId:b.id,
        files: b.data ? [{fileData:b.data,fileType:b.type,fileName:b.name}] : [],
        date:b.bill_date||todayStr, amount:+(b.amount||0)}))
    : [{uid:'r_'+Date.now(), files:[], date:todayStr, amount:''}];

  const rowsTotal=()=>round2(rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0));
  const calcCashCarry=()=>round2(collected-rowsTotal());

  // ── Status banner ──
  function bannerHTML(){
    if(cs.status==='ontime') return `<div class="banner-ok">✅ Today is the last day of <strong>${m.label}</strong> — this month closes automatically today, sealed by President.</div>`;
    if(cs.status==='overdue') return `<div class="banner-grace">🔒 <strong>${cs.daysOver} day${cs.daysOver>1?'s':''} past</strong> month-end (${fmtDDMMYYYY(lastDay)}) — this month should already be auto-closed. Close it now to seal it and carry the balance forward.</div>`;
    if(cs.status==='early')  return `<div class="banner-early">📅 <strong>${m.label}</strong> closes automatically on ${fmtDDMMYYYY(lastDay)} (${cs.daysLeft} day${cs.daysLeft!==1?'s':''} away). Admin early-close override active.</div>`;
    return '';
  }

  // ── Row HTML (pill with multi-attach) ──
  function rowHTML(r,idx){
    const files=r.files||[];
    const hasFiles=files.length>0;
    const thumbsHTML=files.map((f,fi)=>{
      const isImg=f.fileType&&f.fileType.startsWith('image');
      return `<div class="bwss-thumb">
        <span class="pin-decal">📌</span>
        ${isImg
          ?`<img src="${f.fileData}" title="${f.fileName||'Bill attachment'}">`
          :`<div class="pdf-icon">📄</div>`}
        <button class="th-dl" data-uid="${r.uid}" data-fi="${fi}" title="Download">⬇</button>
        <button class="th-del" data-uid="${r.uid}" data-fi="${fi}" title="Remove">✕</button>
        <span class="th-name">${(f.fileName||'bill').slice(0,10)}</span>
      </div>`;
    }).join('');
    return `<div class="bwss-pill" data-uid="${r.uid}">
      <div class="bwss-pill-top">
        <!-- 📌 Pin attach button -->
        <button class="exp-pin-btn${hasFiles?' has-files':''}" data-uid="${r.uid}" title="Attach expense receipt — camera / gallery / file">
          📌${hasFiles?`<span class="pin-count">${files.length}</span>`:''}
        </button>
        <!-- Attach source menu (opens on pin click) -->
        <div class="attach-menu" id="amenu_${r.uid}">
          <button class="am-cam" data-uid="${r.uid}">📷 Camera</button>
          <button class="am-gal" data-uid="${r.uid}">🖼️ Photo Gallery</button>
          <button class="am-fil" data-uid="${r.uid}">📄 Files / PDF</button>
        </div>
        <input type="date" class="bwss-date" data-uid="${r.uid}" value="${r.date||todayStr}"
          style="flex:1.2;padding:8px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:13px;min-width:90px;">
        <div style="position:relative;flex:1.5;min-width:100px;">
          <span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none;">₹</span>
          <input type="number" class="bwss-amt" data-uid="${r.uid}" value="${r.amount||''}"
            placeholder="Amount" min="0" step="0.01"
            style="width:100%;padding:8px 10px 8px 22px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:13px;">
        </div>
        ${idx>0||rows.length>1
          ?`<button class="bwss-del" data-uid="${r.uid}" style="flex-shrink:0;background:none;border:none;color:var(--unpaid);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px;" title="Remove">✕</button>`
          :`<span style="width:28px;flex-shrink:0;"></span>`}
      </div>
      ${hasFiles?`<div class="bwss-thumbs">${thumbsHTML}</div>`:''}
    </div>`;
  }

  // ── Summary panel ──
  function summaryHTML(){
    const tot=rowsTotal();
    const carry=calcCashCarry();
    const hasAmt=rows.some(r=>parseFloat(r.amount)>0);
    const billCt=rows.filter(r=>parseFloat(r.amount)>0).length;
    const attachCt=rows.reduce((s,r)=>s+(r.files||[]).length,0);
    return `
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;">
        <span style="color:var(--muted);">Collected (this month)</span>
        <span style="font-weight:700;color:var(--paid)">${inr(collected)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;">
        <span style="color:var(--muted);">Society Expenses Total <span style="font-size:10.5px;">(${billCt} bill${billCt!==1?'s':''}, ${attachCt} attachment${attachCt!==1?'s':''})</span></span>
        <span style="font-weight:700;color:${hasAmt?'var(--unpaid)':'var(--muted)'}">${inr(tot)}</span>
      </div>
      <div style="height:1px;background:var(--border2);margin:5px 0;"></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;">
        <span style="font-weight:700;">Cash Carry to Next Month</span>
        <span style="font-weight:800;font-size:15px;color:${carry>=0?'var(--paid)':'var(--partial)'}">${carry>=0?'+':''}${inr(carry)}</span>
      </div>
      ${pendingDues>0?`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11.5px;color:var(--muted);">
        <span>Pending flat dues (still to collect)</span><span style="color:var(--partial)">${inr(pendingDues)}</span>
      </div>`:''}`;
  }

  function refreshSummary(){
    const sp=document.getElementById('summaryPanel');
    if(sp) sp.innerHTML=summaryHTML();
    const cb=document.getElementById('doCloseBtn');
    if(cb) cb.disabled=!rows.some(r=>parseFloat(r.amount)>0);
  }

  function renderRows(){
    document.getElementById('bwssRowsEl').innerHTML=rows.map((r,i)=>rowHTML(r,i)).join('');
    wireRows();
    refreshSummary();
  }

  // Close all attach menus
  function closeAllMenus(){
    document.querySelectorAll('.attach-menu').forEach(mn=>mn.classList.remove('open'));
  }

  // Generic file attach
  async function attachFiles(uid,accept,capture){
    const inp=document.createElement('input');
    inp.type='file'; inp.accept=accept; inp.multiple=true;
    if(capture) inp.setAttribute('capture',capture);
    inp.onchange=async(e)=>{
      const files=[...e.target.files]; if(!files.length) return;
      const row=rows.find(r=>r.uid===uid); if(!row) return;
      if(!row.files) row.files=[];
      for(const file of files){
        try{
          let dataUrl=await readFileAsDataUrl(file);
          let type=file.type;
          if(file.type.startsWith('image/')){ dataUrl=await resizeImageDataUrl(dataUrl,1200,0.82); type='image/jpeg'; }
          row.files.push({fileData:dataUrl,fileType:type,fileName:file.name});
        }catch(err){ toast('⚠ '+err.message,'err'); }
      }
      renderRows();
    };
    inp.click();
  }

  function wireRows(){
    // Pin attach button → toggle menu
    document.querySelectorAll('.exp-pin-btn').forEach(btn=>{
      btn.onclick=(e)=>{
        e.stopPropagation();
        const uid=btn.dataset.uid;
        const menu=document.getElementById('amenu_'+uid);
        const wasOpen=menu&&menu.classList.contains('open');
        closeAllMenus();
        if(menu&&!wasOpen) menu.classList.add('open');
      };
    });
    // Camera
    document.querySelectorAll('.am-cam').forEach(btn=>{
      btn.onclick=(e)=>{ e.stopPropagation(); closeAllMenus(); attachFiles(btn.dataset.uid,'image/*','environment'); };
    });
    // Gallery
    document.querySelectorAll('.am-gal').forEach(btn=>{
      btn.onclick=(e)=>{ e.stopPropagation(); closeAllMenus(); attachFiles(btn.dataset.uid,'image/*',null); };
    });
    // Files
    document.querySelectorAll('.am-fil').forEach(btn=>{
      btn.onclick=(e)=>{ e.stopPropagation(); closeAllMenus(); attachFiles(btn.dataset.uid,'image/*,application/pdf',null); };
    });
    // Thumb download
    document.querySelectorAll('.th-dl').forEach(btn=>{
      btn.onclick=(e)=>{
        e.stopPropagation();
        const row=rows.find(r=>r.uid===btn.dataset.uid); if(!row) return;
        const fi=parseInt(btn.dataset.fi);
        const f=row.files[fi]; if(!f) return;
        const a=document.createElement('a');
        a.href=f.fileData;
        a.download=f.fileName||('bwssb-bill-'+row.date+'-'+(fi+1)+(f.fileType&&f.fileType.includes('pdf')?'.pdf':'.jpg'));
        a.click();
      };
    });
    // Thumb delete
    document.querySelectorAll('.th-del').forEach(btn=>{
      btn.onclick=(e)=>{
        e.stopPropagation();
        const row=rows.find(r=>r.uid===btn.dataset.uid); if(!row) return;
        row.files.splice(parseInt(btn.dataset.fi),1);
        renderRows();
      };
    });
    // Date
    document.querySelectorAll('.bwss-date').forEach(inp=>{
      inp.onchange=()=>{ const row=rows.find(r=>r.uid===inp.dataset.uid); if(row) row.date=inp.value; };
    });
    // Amount → live total
    document.querySelectorAll('.bwss-amt').forEach(inp=>{
      inp.oninput=()=>{ const row=rows.find(r=>r.uid===inp.dataset.uid); if(row) row.amount=inp.value; refreshSummary(); };
    });
    // Row delete
    document.querySelectorAll('.bwss-del').forEach(btn=>{
      btn.onclick=async()=>{
        const uid=btn.dataset.uid;
        const row=rows.find(r=>r.uid===uid);
        if(row&&row.dbId){ try{ await deleteBwssBill(row.dbId); }catch(e){} }
        rows=rows.filter(r=>r.uid!==uid);
        if(!rows.length) rows=[{uid:'r_'+Date.now(),files:[],date:todayStr,amount:''}];
        renderRows();
      };
    });
  }

  // ── Render modal ──
  document.getElementById('modalRoot').innerHTML=`
    <div class="overlay" id="ov"><div class="modal" style="width:560px;max-height:90vh;overflow-y:auto;">
      <h3>🔒 Seal &amp; Close — ${m.label}</h3>
      <p style="font-size:12px;color:var(--muted);margin:-4px 0 14px;line-height:1.6;">
        Attach each society expense receipt via 📷 Camera, 🖼️ Gallery, or 📄 Files — multiple attachments per expense row. Enter the payment date and amount. Auto-totals update live. Once sealed, only Admin can reopen.
      </p>
      ${bannerHTML()}
      <div style="font-size:11.5px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;">📌 Society Expenses — Record Below</div>
      <div id="bwssRowsEl"></div>
      <button class="btn" id="addRowBtn" style="margin-bottom:16px;font-size:12.5px;padding:7px 14px;border-style:dashed;">＋ Add Another Expense Row</button>
      <div id="summaryPanel" style="background:var(--panel3);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;margin-bottom:4px;"></div>
      <div class="err" id="closeErr" style="margin-top:8px;"></div>
      <div class="modalbtns">
        <button class="btn" id="cancelBtn">Cancel</button>
        <button class="btn closebill" id="doCloseBtn" disabled>🔏 Seal &amp; Close Bill</button>
      </div>
    </div></div>`;

  // Close menus on outside click
  document.addEventListener('click', closeAllMenus);
  document.getElementById('cancelBtn').onclick=()=>{ document.removeEventListener('click',closeAllMenus); closeModal(); };
  document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov'){ document.removeEventListener('click',closeAllMenus); closeModal(); }});
  document.getElementById('addRowBtn').onclick=()=>{
    rows.push({uid:'r_'+Date.now(),files:[],date:todayStr,amount:''});
    renderRows();
    const el=document.getElementById('bwssRowsEl');
    if(el&&el.lastElementChild) el.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  document.getElementById('doCloseBtn').onclick=async()=>{
    const validRows=rows.filter(r=>parseFloat(r.amount)>0);
    if(!validRows.length){ document.getElementById('closeErr').textContent='Enter at least one expense amount.'; return; }
    const btn=document.getElementById('doCloseBtn');
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Sealing…';
    try{
      await deleteAllBwssBills(key);
      for(const r of validRows){
        // Save first file as primary (legacy compat), amount, date
        const primaryFile=r.files&&r.files[0];
        await saveBwssBill(key,
          primaryFile?(primaryFile.fileName||('Expense-'+r.date)):'Payment '+r.date,
          primaryFile?primaryFile.fileType:'',
          primaryFile?primaryFile.fileData:'',
          parseFloat(r.amount)||0, r.date);
      }
      await closeMonth(key, rowsTotal(), collected, calcCashCarry());
      document.removeEventListener('click',closeAllMenus);
      closeModal(); render(); toast('🔏 '+m.label+' sealed & closed','ok');
    }catch(err){
      document.getElementById('closeErr').textContent='❌ '+err.message;
      btn.disabled=false; btn.textContent='🔏 Seal & Close Bill';
    }
  };
  renderRows();
}

/* ════════ HISTORY / RESTORE MODAL ════════ */
const TRIGGER_LABELS={
  create:'🟢 Month Created',
  edit_total:'✏️ Bill Total Edited',
  payment:'💳 Payment Recorded',
  close:'🔒 Month Sealed',
  auto_close:'⚡ Auto-Sealed by System',
  reopen:'🔓 Month Reopened',
  pre_restore:'↩ Pre-Restore Checkpoint'
};
const TRIGGER_DOT_CLASS={
  create:'create',edit_total:'edit_total',payment:'payment',
  close:'close',auto_close:'auto_close',reopen:'reopen',pre_restore:'edit_total'
};

async function openHistoryModal(key){
  if(!isAdmin()){ toast('🔒 Admin access required','err'); return; }
  const m=state.months[key];
  document.getElementById('modalRoot').innerHTML=`
    <div class="overlay" id="ov"><div class="modal" style="width:520px;max-height:92vh;overflow-y:auto;">
      <h3>🕐 Restore History — ${m.label}</h3>
      <div class="hint" style="margin-top:0;line-height:1.7;">Each entry below is a restore point captured before every bill edit, payment, or close action. Click a snapshot to preview its state, then restore if needed.<br><strong style="color:var(--partial);">⚠ Restoring overwrites current flat payment data for this month.</strong></div>
      <div id="snapListEl"><div style="text-align:center;padding:30px;color:var(--muted);font-size:13px;"><span class="spinner"></span> Loading history…</div></div>
      <div id="snapPreviewEl" class="snap-preview"></div>
      <div class="err" id="snapErr"></div>
      <div class="modalbtns">
        <button class="btn" id="cancelBtn">Close</button>
        <button class="btn primary" id="restoreBtn" disabled>↩ Restore Selected</button>
      </div>
    </div></div>`;
  document.getElementById('cancelBtn').onclick=closeModal;
  document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});

  let selectedSnapId=null;

  function renderSnapList(snaps){
    const el=document.getElementById('snapListEl');
    if(!snaps.length){
      el.innerHTML=`<div class="snap-empty">No restore points yet for ${m.label}.<br><span style="font-size:11px;">Snapshots are created automatically when you edit a bill, record a payment, or close a month.</span></div>`;
      return;
    }
    el.innerHTML=`<div class="snap-list">${snaps.map(s=>{
      const dt=new Date(s.snapshot_at);
      const dateStr=fmtDDMMYYYY(dt);
      const timeStr=dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
      const label=TRIGGER_LABELS[s.trigger]||s.trigger;
      const dotCls=TRIGGER_DOT_CLASS[s.trigger]||'edit_total';
      return `<div class="snap-item" data-snapid="${s.id}">
        <span class="snap-dot ${dotCls}"></span>
        <div class="snap-info">
          <div class="snap-time">${dateStr} · ${timeStr}</div>
          <div class="snap-trigger">${label}</div>
          <div class="snap-meta">${inr(s.total_amount)} total · ${inr(s.collected)} collected · ${s.paid_count} paid</div>
        </div>
      </div>`;
    }).join('')}</div>`;

    el.querySelectorAll('.snap-item').forEach(item=>{
      item.addEventListener('click',async()=>{
        el.querySelectorAll('.snap-item').forEach(x=>x.classList.remove('selected'));
        item.classList.add('selected');
        selectedSnapId=parseInt(item.dataset.snapid);
        document.getElementById('restoreBtn').disabled=false;
        document.getElementById('snapErr').textContent='';
        // Load preview
        const prev=document.getElementById('snapPreviewEl');
        prev.className='snap-preview visible';
        prev.innerHTML=`<div style="color:var(--muted);font-size:12px;padding:6px 0;"><span class="spinner"></span> Loading preview…</div>`;
        try{
          const flats=await getSnapshotFlats(selectedSnapId);
          if(!flats){ prev.innerHTML='<div style="color:var(--muted);font-size:12px;">Preview unavailable.</div>'; return; }
          const snap=snaps.find(s=>s.id===selectedSnapId);
          const paidCt=Object.values(flats).filter(f=>f.st==='paid').length;
          const partCt=Object.values(flats).filter(f=>f.st==='partial').length;
          const unpaidCt=Object.values(flats).filter(f=>f.st==='unpaid').length;
          prev.innerHTML=`
            <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">📋 Snapshot Preview</div>
            <div class="snap-preview-row"><span style="color:var(--muted);">Total Bill Amount</span><span style="font-weight:700;">${inr(snap.total_amount)}</span></div>
            <div class="snap-preview-row"><span style="color:var(--muted);">Base Share / Flat</span><span>${inr(snap.base_share)}</span></div>
            <div class="snap-preview-row"><span style="color:var(--muted);">Collected</span><span style="color:var(--paid);">${inr(snap.collected)}</span></div>
            <div class="snap-preview-row"><span style="color:var(--muted);">Pending</span><span style="color:var(--unpaid);">${inr(snap.pending)}</span></div>
            <div class="snap-preview-row"><span style="color:var(--muted);">Flat Status</span><span><span style="color:var(--paid);">${paidCt} paid</span> · <span style="color:var(--partial);">${partCt} partial</span> · <span style="color:var(--unpaid);">${unpaidCt} unpaid</span></span></div>
          `;
        }catch(e){ prev.innerHTML=`<div style="color:var(--muted);font-size:12px;">Preview failed: ${e.message}</div>`; }
      });
    });
  }

  // Load snapshots
  try{
    const snaps=await getSnapshots(key);
    renderSnapList(snaps);
  }catch(e){
    document.getElementById('snapListEl').innerHTML=`<div class="snap-empty" style="color:var(--unpaid);">Failed to load history: ${e.message}</div>`;
  }

  document.getElementById('restoreBtn').onclick=async()=>{
    if(!selectedSnapId) return;
    const errEl=document.getElementById('snapErr');
    errEl.textContent='';
    setBtnLoading('restoreBtn',true,'Restoring…');
    try{
      await restoreSnapshot(key,selectedSnapId);
      closeModal();
      render();
      toast(`↩ ${m.label} restored to selected snapshot`,'ok');
    }catch(e){
      errEl.textContent='❌ Restore failed: '+e.message;
      setBtnLoading('restoreBtn',false,'↩ Restore Selected');
    }
  };
}

function openExportFilterModal(key,format){
  const m=state.months[key];
  const counts={paid:0,partial:0,unpaid:0};
  Object.values(m.flats).forEach(f=>{counts[f.status]=(counts[f.status]||0)+1;});
  // Smart default: if a status filter is already active on screen, pre-select just that one
  const preset=filters.status!=='ALL'?[filters.status]:['paid','partial','unpaid'];
  const isExcel=format==='excel';
  document.getElementById('modalRoot').innerHTML=`
    <div class="overlay" id="ov"><div class="modal" style="width:400px;max-height:85vh;overflow-y:auto;">
      <h3>${format==='pdf'?'📄 Export PDF':'📊 Export Excel'} — ${m.label}</h3>
      <div class="hint" style="margin-top:0;margin-bottom:10px;">Choose which flats to include, by payment status.</div>
      <label style="display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;">
        <input type="checkbox" id="exf-paid" ${preset.includes('paid')?'checked':''} style="width:16px;height:16px;">
        <span style="color:var(--paid);font-weight:700;">✅ Paid</span><span class="hint" style="margin:0;">(${counts.paid||0} flats)</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;">
        <input type="checkbox" id="exf-partial" ${preset.includes('partial')?'checked':''} style="width:16px;height:16px;">
        <span style="color:var(--partial);font-weight:700;">🟡 Partial</span><span class="hint" style="margin:0;">(${counts.partial||0} flats)</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;">
        <input type="checkbox" id="exf-unpaid" ${preset.includes('unpaid')?'checked':''} style="width:16px;height:16px;">
        <span style="color:var(--unpaid);font-weight:700;">🔴 Unpaid</span><span class="hint" style="margin:0;">(${counts.unpaid||0} flats)</span>
      </label>
      ${isExcel?`
      <div style="border-top:1px solid var(--border2);margin-top:8px;padding-top:10px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;margin-bottom:6px;">
          <input type="checkbox" id="exf-colall" checked style="width:16px;height:16px;">
          <span>Columns to Include</span>
        </label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;">
          ${EXPORT_COLUMNS.map(c=>`<label style="display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer;font-size:12px;">
            <input type="checkbox" class="exf-col" data-col="${c.key}" checked style="width:14px;height:14px;">
            <span>${c.label}</span>
          </label>`).join('')}
        </div>
      </div>`:''}
      <div class="hint" id="exfErr" style="color:var(--unpaid);margin-top:8px;"></div>
      <div class="modalbtns">
        <button class="btn" id="exfCancel">Cancel</button>
        <button class="btn primary" id="exfGo">${format==='pdf'?'⬇ Download PDF':'⬇ Download Excel'}</button>
      </div>
    </div></div>`;
  document.getElementById('exfCancel').onclick=closeModal;
  document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});
  if(isExcel){
    const master=document.getElementById('exf-colall');
    const boxes=()=>document.querySelectorAll('.exf-col');
    master.onchange=()=>{ boxes().forEach(b=>b.checked=master.checked); };
    boxes().forEach(b=>b.onchange=()=>{ master.checked=[...boxes()].every(x=>x.checked); });
  }
  document.getElementById('exfGo').onclick=()=>{
    const statuses=['paid','partial','unpaid'].filter(s=>document.getElementById('exf-'+s).checked);
    if(!statuses.length){document.getElementById('exfErr').textContent='Select at least one status.';return;}
    if(format==='pdf'){ closeModal(); exportPDF(key,statuses); return; }
    const cols=[...document.querySelectorAll('.exf-col')].filter(b=>b.checked).map(b=>b.dataset.col);
    if(!cols.length){document.getElementById('exfErr').textContent='Select at least one column.';return;}
    closeModal();
    exportExcel(key,statuses,cols);
  };
}
function statusFilterLabel(statuses){
  if(statuses.length===3) return 'All Statuses';
  return statuses.map(s=>s.toUpperCase()).join(' + ');
}
function exportPDF(key,statuses){
  const m=state.months[key];
  statuses=statuses||['paid','partial','unpaid'];
  const{jsPDF}=window.jspdf;const doc=new jsPDF();
  const pageW=doc.internal.pageSize.getWidth();
  const flatsFiltered=ALL_FLATS.filter(f=>statuses.includes(m.flats[f.id].status));
  const collected=flatsFiltered.reduce((s,f)=>s+m.flats[f.id].paid,0);
  // Pending Balance always reflects the WHOLE month (same figure as the Dashboard's
  // "Pending" card) regardless of which statuses are filtered into this report —
  // filtering which flats are listed shouldn't change what's actually still owed.
  const pending=round2(ALL_FLATS.reduce((s,f)=>s+m.flats[f.id].balance,0));

  // ── Header banner ──────────────────────────────────────────
  doc.setFillColor(26,19,48);
  doc.rect(0,0,pageW,36,'F');
  doc.setDrawColor(155,93,229);
  doc.setLineWidth(1.1);
  doc.line(0,36,pageW,36);
  try{ doc.addImage(LOGO_DATA_URL,'JPEG',12,6,24,24); }catch(e){}
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(14.5);
  doc.text(ASSOC_NAME,42,15);
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.setTextColor(190,205,225);
  doc.text('Maintenance Billing Statement',42,21.5);
  doc.setFontSize(8.5);
  doc.setTextColor(140,160,190);
  const genDate=fmtDDMMYYYY(new Date());
  const genTime=new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true});
  doc.text(`${m.label}   ·   Generated ${genDate}, ${genTime}`,42,27.5);

  // ── Summary strip ──────────────────────────────────────────
  let y=46;
  doc.setTextColor(30,35,45);
  doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('Maintenance / Flat',14,y);doc.text('Total Collectible',80,y);doc.text('Collected',146,y);
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  doc.text(inrPdf(m.baseShare),14,y+5.5);doc.text(inrPdf(m.totalAmount),80,y+5.5);
  doc.setTextColor(31,157,99);doc.text(inrPdf(collected),146,y+5.5);
  y+=15;
  doc.setTextColor(30,35,45);
  doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('Pending Balance',14,y);doc.text('Filter Applied',80,y);doc.text('Flats Included',146,y);
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  doc.setTextColor(216,56,62);doc.text(inrPdf(pending),14,y+5.5);
  doc.setTextColor(30,35,45);doc.text(statusFilterLabel(statuses),80,y+5.5);
  doc.text(String(flatsFiltered.length)+' of '+TOTAL_FLATS,146,y+5.5);
  doc.setDrawColor(220,225,232);doc.setLineWidth(.3);doc.line(14,y+9,pageW-14,y+9);

  const rows=flatsFiltered.map(f=>{const d=m.flats[f.id];return[f.id,inrPdf(d.carryForward),inrPdf(d.due),inrPdf(d.paid),balPdf(d.balance),d.status.toUpperCase(),d.paidDate?fmtDDMMYYYY(d.paidDate):'—',d.paymentMethod?d.paymentMethod.toUpperCase():'—'];});
  doc.autoTable({
    startY:y+14,
    head:[['Flat','Carry Fwd','Total Due','Paid','Balance','Status','Paid On','Method']],
    body:rows,
    styles:{fontSize:8,cellPadding:2.4,lineColor:[224,229,236],lineWidth:.15},
    headStyles:{fillColor:[26,19,48],textColor:255,fontStyle:'bold',fontSize:8.2},
    alternateRowStyles:{fillColor:[245,248,252]},
    didParseCell(data){if(data.section==='body'&&data.column.index===5){const v=data.cell.raw;data.cell.styles.fontStyle='bold';if(v==='PAID')data.cell.styles.textColor=[31,157,99];else if(v==='PARTIAL')data.cell.styles.textColor=[179,131,10];else data.cell.styles.textColor=[216,56,62];}},
    didDrawPage(data){
      const pc=doc.internal.getNumberOfPages();
      doc.setFontSize(7.5);doc.setTextColor(150,158,170);doc.setFont('helvetica','normal');
      doc.text(`${ASSOC_NAME} · System-generated statement`,14,doc.internal.pageSize.getHeight()-8);
      doc.text(`Page ${data.pageNumber} of ${pc}`,pageW-14,doc.internal.pageSize.getHeight()-8,{align:'right'});
    }
  });
  const suffix=statuses.length===3?'':'_'+statuses.join('-');
  doc.save(`MaintenanceBill_${key}${suffix}.pdf`);toast(`⬇ PDF downloaded (${statusFilterLabel(statuses)})`,'ok');
}
function exportExcel(key,statuses,cols){
  const m=state.months[key];
  statuses=statuses||['paid','partial','unpaid'];
  cols=cols&&cols.length?cols:EXPORT_COLUMNS.map(c=>c.key);
  const colDefs=EXPORT_COLUMNS.filter(c=>cols.includes(c.key));
  const flatsFiltered=ALL_FLATS.filter(f=>statuses.includes(m.flats[f.id].status));
  const header=colDefs.map(c=>c.label);
  const rows=flatsFiltered.map(f=>{const d=m.flats[f.id];return colDefs.map(c=>c.get(f,d));});
  const collected=flatsFiltered.reduce((s,f)=>s+m.flats[f.id].paid,0);
  // Pending Balance always reflects the WHOLE month (same figure as the Dashboard's
  // "Pending" card) regardless of which statuses are filtered into this report.
  const pending=round2(ALL_FLATS.reduce((s,f)=>s+m.flats[f.id].balance,0));
  const ws=XLSX.utils.aoa_to_sheet([
    [ASSOC_NAME],
    [`Maintenance Billing Statement — ${m.label}`],
    [`Total Bill: ${m.totalAmount}   Base Share: ${m.baseShare}`],
    [`Filter: ${statusFilterLabel(statuses)}   Flats: ${flatsFiltered.length}   Collected: ${collected}   Pending: ${pending}`],
    [],header,...rows
  ]);
  ws['!cols']=header.map(()=>({wch:16}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,key);
  const suffix=statuses.length===3?'':'_'+statuses.join('-');
  XLSX.writeFile(wb,`MaintenanceBill_${key}${suffix}.xlsx`);toast(`⬇ Excel downloaded (${statusFilterLabel(statuses)}, ${colDefs.length} columns)`,'ok');
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  document.getElementById('configBtn').onclick=openConfigModal;
  document.getElementById('newMonthBtn').onclick=openNewMonthModal;
  document.getElementById('penaltyBtn').onclick=()=>{ if(isAdmin()) openPenaltyConfigModal(); else openLoginModal(); };
  document.getElementById('flatCountLabel').textContent=`${TOTAL_FLATS} Flats · Blocks ${BLOCKS[0].block}–${BLOCKS[BLOCKS.length-1].block}`;
  if(isTursoConfigured()){
    updateDbUI('loading','Connecting…');
    const ok=await loadState();
    if(ok){ try{ await autoCloseOverdueMonths(); }catch(e){console.warn('auto-close:',e);} }
    else updateDbUI('err','Connection failed');
  } else {
    updateDbUI('off','Not configured');
  }
  render();
}
init();
</script>
